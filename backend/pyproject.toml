# Slice 1.5 - exempt generated gRPC stubs from ruff. The stubs are
# regenerated by `python -m grpc_tools.protoc` and the generator emits
# `class X(object):` (UP004), missing return type annotations (ANN), and
# other style issues that are out of our control without forking the generator.
[tool.ruff]
extend-exclude = [
    "apps/realtime/_streamd_pb2/api_pb2.py",
    "apps/realtime/_streamd_pb2/api_pb2_grpc.py",
]

[tool.mutmut]
paths_to_mutate = [
  "apps",
]
also_copy = ["apps", "config"]
do_not_mutate = [
  "*/migrations/*",
  "*/test_*.py",
  "*/tests.py",
  "*/tests/*",
]
pytest_add_cli_args = ["-o", "addopts="]
pytest_add_cli_args_test_selection = [
  "apps",
]
