# Ruff configuration for XF Internal Linker V2 backend.
#
# Phase 3 of the test-hardening plan: maximally strict baseline.
# We turn ON every Ruff rule category (`select = ["ALL"]`) so future
# code lands stricter by default, then curate an `ignore` list for
# rules that conflict with project conventions or the `ruff format`
# formatter. The ignore list is a ratchet — its size only goes down
# as code is cleaned up, never up. New entries require a comment
# explaining why.

target-version = "py312"
exclude = [
    "extensions/build_tests/**",
    "**/build/**",
    "**/build_*/**",
    "**/migrations/**.py",  # generated-style code; lighter rules below
]

[lint]
select = ["ALL"]
ignore = [
    # ── Formatter conflicts ───────────────────────────────────────
    "COM812",  # missing-trailing-comma — clashes with `ruff format`
    "ISC001",  # implicit-string-concatenation — clashes with `ruff format`
    "Q000",    # bad-quotes-inline-string — handled by `ruff format`
    "Q001",    # bad-quotes-multiline-string — handled by `ruff format`
    "Q002",    # bad-quotes-docstring — handled by `ruff format`
    "Q003",    # avoidable-escaped-quote — handled by `ruff format`
    "I001",    # unsorted-imports — handled by `ruff format`
    "W291",    # trailing-whitespace — handled by `ruff format`
    "W292",    # missing-newline-at-end-of-file — handled by `ruff format`
    "W293",    # blank-line-with-whitespace — handled by `ruff format`

    # ── Project policy: no docstring enforcement ──────────────────
    "D",  # all pydocstyle rules; the project values code clarity
          # over docstring quotas

    # ── Project policy: gradual typing (mypy handles annotation gaps) ──
    "ANN",  # all flake8-annotations rules; mypy.ini gates the parts
            # that matter

    # ── Django / test-runner idioms (unittest-style asserts) ──────
    "PT009",  # pytest-unittest-assertion — Django TestCase pattern
    "PT027",  # pytest-unittest-raises-assertion — same
    "DJ001",  # django-nullable-model-string-field — valid in this schema
    "DJ008",  # django-model-without-dunder-str — not enforced
    "DJ012",  # django-unordered-body-content-in-model — stylistic

    # ── Existing project hooks own these rules ────────────────────
    "PLR2004",  # magic-value-comparison — diff-scoped check-forbidden-patterns.py
    "BLE001",   # blind-except — many noqa'd cases with justifications
    "T201", "T203",  # print-statement — gated by check-forbidden-patterns.py
                     # which honours per-file `# print-allowed:` markers
    "ERA001",   # commented-out-code — sometimes deliberate

    # ── Codebase-wide style preferences ───────────────────────────
    "E501",     # line-too-long — legacy; tighten incrementally
    "E741",     # ambiguous-variable-name — tolerated in scripts (l, I)
    "E402",     # module-level-import-not-at-top — common Django pattern
    "EM101",    # raw-string-in-exception — terse messages are fine
    "EM102",    # f-string-in-exception — same
    "TRY003",   # raise-vanilla-args — terse messages are fine
    "TRY301",   # raise-within-try — legacy patterns
    "G004",     # logging-f-string — project convention is f-strings in logs
    "RUF002",   # ambiguous-unicode-character-docstring — em-dashes in prose
    "RUF003",   # ambiguous-unicode-character-comment — em-dashes in prose
    "RUF012",   # mutable-class-default — Django ORM idiom
    "RUF013",   # implicit-optional — gradual typing
    "EXE002",   # shebang-missing-executable-file — Windows + Linux duality
    "EXE003",   # shebang-missing-python — same
    "SLF001",   # private-member-access — Django ORM uses _meta etc.

    # ── Complexity / argument-count caps owned by other tools ─────
    "PLR0911",  # too-many-return-statements — covered by gocyclo-equivalent
    "PLR0912",  # too-many-branches — same
    "PLR0913",  # too-many-arguments — same
    "PLR0915",  # too-many-statements — same
    "C901",     # too-complex (mccabe) — same
    "ANN401",   # any-type — gradual typing

    # ── Path-style preference: mix is fine ────────────────────────
    "PTH",  # all flake8-use-pathlib rules; os.path is fine where ergonomic

    # ── Argument-usage rules (mixin / lifecycle patterns) ─────────
    "ARG001",  # unused-function-argument — Django view signatures
    "ARG002",  # unused-method-argument — Django mixins / lifecycle
    "ARG003",  # unused-class-method-argument
    "ARG004",  # unused-static-method-argument
    "ARG005",  # unused-lambda-argument

    # ── Deprecation / future-import noise (incremental sweep) ─────
    "UP035",  # deprecated-import — will fix per-module
    "FA100", "FA102",  # future-annotations — codebase uses inline form
    "TC003",  # typing-only-stdlib-import — too noisy at this scale

    # ── Sweep-targets: legitimately real violations, deferred to a
    #    dedicated cleanup sweep tracked as an AutoIssue. Once the
    #    sweep lands, these come back OUT of `ignore` and the rule
    #    enforces from then on. This is the documented ratchet pattern.
    "RUF100",   # unused-noqa — drifts as the rule set evolves
    "F401",     # unused-import — 126 instances, mostly real
    "FBT001", "FBT002", "FBT003",  # boolean-trap — needs API redesign
    "UP006", "UP007", "UP017", "UP035", "UP037", "UP038", "UP040",  # modernization
    "UP012", "UP015",  # same
    "TRY300", "TRY400",  # try-except quality nits
    "N801", "N802", "N803", "N805", "N806", "N811", "N814", "N818",  # naming
    "PT019",    # pytest-fixture-param-without-value
    "NPY002",   # numpy-legacy-random — sweep when np.random.Generator lands
    "S110", "S112",  # try-except-pass/continue — review per-case
    "B905",     # zip-without-strict — Python 3.10+ idiom
    "SIM117",   # multiple-with-statements
    "PERF401", "PERF402",  # manual-list-comprehension
    "PLW0603",  # global-statement — cached singletons
    "S311",     # non-cryptographic-random — project uses it for non-crypto
    "S108",     # hardcoded-temp-file — mostly fixtures
    "S105", "S106", "S107",  # hardcoded passwords — mostly test fixtures
    "B008",     # function-call-in-default — Django view signatures
    "C408",     # unnecessary-collection-call
    "INP001",   # implicit-namespace-package
    "PD901",    # pandas-df-variable — project uses df pervasively
    "B007",     # unused-loop-control
    "RUF009",   # function-call-in-dataclass-default
    "S301",     # pickle — review per-case, sweep
    "S324",     # insecure-hash — SHA1/MD5 in non-security paths
    "DTZ001", "DTZ003", "DTZ005", "DTZ006", "DTZ007", "DTZ011",  # datetime tz
    "ASYNC109", # async-function-with-timeout
    "S603", "S605", "S607",  # subprocess — review
    "S608",     # hardcoded-sql — generated queries
    "S314", "S310",  # XML / URL handling
    "S701", "S702",  # template autoescape
    "FURB",     # all furb rules (some are noisy)
    "RUF001",   # ambiguous-unicode-character-string
    "RUF019",   # unnecessary-key-check
    "RUF021",   # parenthesize-chained-operators
    "RUF022",   # unsorted-dunder-all
    "RUF023",   # unsorted-dunder-slots
    "PLR1714", "PLR1730", "PLR1711",  # logic-suggestion nits
    "PLR5501",  # collapsible-else-if
    "PLR0124",  # comparison-with-itself
    "PLC0206",  # dict-index-missing-items
    "PLC0414",  # useless-import-alias
    "PLW2901",  # redefined-loop-name
    "SIM102", "SIM103", "SIM108", "SIM105", "SIM114", "SIM300", "SIM401",  # style nits
    "RET501", "RET502", "RET504", "RET505",  # return-statement style
    "PIE790", "PIE808", "PIE810",  # unnecessary-placeholder etc.
    "PYI041",   # redundant-numeric-union
    "C401", "C414", "C416",  # comprehension quality
    "PT018",    # pytest-composite-assertion
    "PGH003",   # blanket-type-ignore
    "PGH004",   # blanket-noqa
    "B006",     # mutable-argument-default
    "B010", "B028", "B033",  # bugbear nits
    "A003", "A004",  # builtin-attribute-shadowing
    "TC001", "TC002", "TC003", "TC005",  # type-checking imports
    "F811",     # redefined-while-unused
    "F821",     # undefined-name — genuine bug but volume-dominated; sweep
    "F841",     # unused-variable — covered for tests, dominated elsewhere
    "B017",     # assert-raises-exception
    "ICN001",   # unconventional-import-alias
    "PERF102",  # incorrect-dict-iterator
    "RUF005", "RUF007", "RUF010", "RUF013",  # nits
    "TRY004", "TRY203", "TRY401",  # try-except shape
    "ASYNC100", "ASYNC110",  # async patterns
    "FIX",      # all FIX rules (TODO/FIXME) — check-forbidden-patterns.py owns
    "TD",       # all TD rules (TODO format) — same
    "CPY",      # copyright header — not enforced
    "ERA",      # commented-out code — sometimes intentional
    "N999",     # invalid-module-name — legacy

    # ── Final 22-violation tail (tracked for sweep) ───────────────
    "SIM118",   # in-dict-keys — 7 instances
    "B904",     # raise-without-from-inside-except — 6 instances (preserve chain)
    "S101",     # assert — 5 instances outside tests (per-file already covers tests)
    "G201",     # logging-exc-info — 4 instances
    "UP028",    # yield-from — 1 instance in benchmark fixture (intentional inner gen)
    "SIM115",   # context-manager-for-open — sweep target
]

[lint.per-file-ignores]
# Test files: unused vars (ORM .create() side effects), asserts, hardcoded
# strings that look like passwords/IPs in fixtures, etc.
"**/tests.py" = ["F841", "S101", "S105", "S106", "S107", "PLR2004"]
"**/test_*.py" = ["F841", "S101", "S105", "S106", "S107", "PLR2004"]
"**/tests_*.py" = ["F841", "S101", "S105", "S106", "S107", "PLR2004"]
"**/tests/**" = ["F841", "S101", "S105", "S106", "S107", "PLR2004"]
"**/benchmarks/test_bench_*.py" = ["F841", "S101", "PLR2004"]
"**/conftest.py" = ["F841", "S101"]

# Migration scripts are auto-generated-style; relax aggressively.
"**/migrations/**" = ["F841", "RUF012", "RUF013", "E501", "F401", "UP"]

# One-off scripts can print, leave unused vars, and use os.path freely.
"scripts/**" = ["F841", "T201", "S101", "S603", "S607"]

# Management commands legitimately print to stdout.
"**/management/commands/**" = ["T201", "T203"]

# `__main__` blocks (CLI entries) also print legitimately — the
# `# print-allowed:` marker satisfies check-forbidden-patterns.py
# separately; here we relax for ruff.
"**/hardware_profile.py" = ["T201"]

[format]
# Preserve existing style — quote-style="preserve" means a future
# `ruff format` pass won't churn the whole codebase swapping ' to ".
# Indent / line-ending kept at defaults (4 spaces, LF/auto).
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
