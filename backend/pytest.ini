[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py tests_*.py tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    # Coverage is added by scoped quality wrappers, not by pytest's global
    # default. This keeps `pytest path/to/test.py` from measuring unrelated
    # backend modules and hiding the changed-file signal behind the whole app.
    # 2026-05-17 — paper-trail #586 Phase C: dropped the global
    # `--cov-fail-under=68` flag. The per-module coverage hard gate at
    # `.githooks/check-per-module-coverage.py` now enforces tier-based
    # thresholds keyed by `coverage-modules.yaml` (tier1=95% line / tier2=90%
    # / tier3=80%). A single global floor no longer makes sense once each
    # module has its own target. The old line read: --cov-fail-under=68
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring a live database
    unit: marks pure unit tests with no I/O
    property: property-based (Hypothesis) tests over pure logic — run by scripts/run-pbt.sh at pre-commit
