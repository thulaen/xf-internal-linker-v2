# maturin is the build backend that compiles this Rust crate into an
# importable Python extension module. `pip install .` or `maturin develop`
# reads this file, runs `cargo build`, and produces/installs the wheel.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xf_kernels"
version = "0.1.0"
description = "Scaffold Rust kernel crate exposed to Python via PyO3 (build-path proof)."
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Build against the stable ABI so one wheel covers CPython 3.10+.
features = ["pyo3/extension-module"]
