[package]
name = "l2norm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "L2 normalization hot-path kernel, ported from C++ to Rust, exposed to Python as extensions.l2norm via PyO3."

[lib]
# `cdylib` produces the shared library that becomes the importable Python
# extension module. The lib name (`l2norm`) MUST match the `#[pymodule]`
# function name in `src/lib.rs` and the artifact this crate ships as
# `extensions.l2norm`, otherwise the import name and the built artifact
# name disagree. `rlib` keeps the crate usable as a plain Rust library so
# `cargo test` can exercise the core logic without crossing the Python edge.
name = "l2norm"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: build against the stable Python ABI (CPython 3.10+) so one
# wheel works across future 3.x without a per-minor rebuild. Pinned to the
# 0.26 line to match the workspace scaffold (`xf_kernels`).
pyo3 = { version = "0.26", features = ["abi3-py310"] }
# `numpy` 0.26 pairs with `pyo3` 0.26 and gives zero-copy read-write views
# (`PyReadwriteArray1` for the 1-D path, `PyReadwriteArrayDyn` for the batch
# path) over the float32 arrays the embedding pipeline passes in, so we mutate
# in place exactly like the C++ kernel.
numpy = "0.26"

[dev-dependencies]
# Criterion drives the mandatory hot-path benchmark (3 input sizes) over the
# plain-Rust core (`normalize_l2_batch_buffer`) without crossing the Python
# boundary, matching the Mandatory Benchmark Rule and RUST-FIRST.md step 5.
criterion = "0.5"
# Proptest drives the property-based tests over the pure core
# (`normalize_l2_slice`). Cases default to 50 locally and are raised via the
# PROPTEST_CASES env var in CI (see scripts/run-pbt.sh).
proptest = { workspace = true }

[[bench]]
name = "bench_l2norm"
harness = false

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]
