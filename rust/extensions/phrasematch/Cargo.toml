[package]
name = "phrasematch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Longest-contiguous-overlap phrase-matching hot-path kernel, ported from C++ to Rust, exposed to Python as extensions.phrasematch via PyO3."

[lib]
# `cdylib` produces the shared library that becomes the importable Python
# extension module. The lib name (`phrasematch`) MUST match the `#[pymodule]`
# function name in `src/lib.rs` and the artifact this crate ships as
# `extensions.phrasematch`, otherwise the import name and the built artifact
# name disagree. `rlib` keeps the crate usable as a plain Rust library so
# `cargo test` and the Criterion benchmark can exercise the core logic without
# crossing the Python boundary.
name = "phrasematch"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: build against the stable Python ABI (CPython 3.10+) so one wheel
# works across future 3.x without a per-minor rebuild. Pinned to the 0.26 line
# to match the workspace scaffold (`xf_kernels`). No `numpy` here: this kernel
# takes two `list[str]` and returns an `int`, not arrays, so it needs only base
# PyO3.
pyo3 = { version = "0.26", features = ["abi3-py310"] }

[dev-dependencies]
# Criterion drives the mandatory hot-path benchmark (3 input sizes) over the
# plain-Rust core (`longest_contiguous_overlap_core`) without crossing the
# Python boundary, matching the Mandatory Benchmark Rule and RUST-FIRST.md
# step 5.
criterion = "0.5"

[[bench]]
name = "bench_phrasematch"
harness = false

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]
