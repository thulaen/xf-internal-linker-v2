[package]
name = "ranking_decision_engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
repository = "https://github.com/local/xf-internal-linker-v2"
readme = "README.md"
keywords = ["ranking", "pyo3", "maturin", "decision", "engine"]
categories = ["algorithms", "api-bindings"]
description = "Rust authority for bounded ranking decisions, profile validation, and memory budgeting."

[lib]
name = "ranking_decision_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py310"] }

[dev-dependencies]
criterion = "0.5"

[features]
extension-module = ["pyo3/extension-module"]

[[bench]]
name = "bench_ranking_decision_engine"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
