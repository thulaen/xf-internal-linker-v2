[package]
name = "simsearch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bounded top-k dot-product sentence-search kernel, ported from C++ to Rust, exposed to Python as extensions.simsearch via PyO3."

[lib]
# `cdylib` produces the shared library that becomes the importable Python
# extension module. The lib name (`simsearch`) MUST match the `#[pymodule]`
# function name in `src/lib.rs` and the artifact this crate ships as
# `extensions.simsearch`, otherwise the import name and the built artifact
# name disagree. `rlib` keeps the crate usable as a plain Rust library so
# `cargo test` and the Criterion benchmark can exercise the core logic
# without crossing the Python boundary.
name = "simsearch"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3-py310: build against the stable Python ABI (CPython 3.10+) so one
# wheel works across future 3.x without a per-minor rebuild. Pinned to the
# 0.26 line to match the workspace scaffold (`xf_kernels`).
pyo3 = { version = "0.26", features = ["abi3-py310", "extension-module"] }
# `numpy` 0.26 pairs with `pyo3` 0.26 and gives zero-copy read-only views
# (`PyReadonlyArray1`/`PyReadonlyArray2`) over the float32 query vector and
# sentence matrix, plus `IntoPyArray` to build the int64 index / float32 score
# output arrays without an extra copy.
numpy = "0.26"

[dev-dependencies]
# Criterion drives the mandatory hot-path benchmark (3 input sizes) over the
# plain-Rust core (`score_and_topk_core`) without crossing the Python
# boundary, matching the Mandatory Benchmark Rule and RUST-FIRST.md step 5.
criterion = "0.5"

[[bench]]
name = "bench_simsearch"
harness = false

[lints]
workspace = true
