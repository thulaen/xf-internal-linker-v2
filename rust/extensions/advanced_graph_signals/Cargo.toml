[package]
name = "advanced_graph_signals"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Fast hot-path calculations for advanced graph signals (FR-260 to FR-265) exposed to Python via PyO3."

[lib]
name = "advanced_graph_signals"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py310"] }
numpy = "0.26"
ndarray = "0.16"

[dev-dependencies]
criterion = "0.5"
proptest = { workspace = true }

[[bench]]
name = "signal_benches"
harness = false

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]
