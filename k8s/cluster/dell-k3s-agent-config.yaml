# Dell (k3s agent) node configuration — SLICE-10.
#
# THIS FILE IS THE SOURCE-OF-TRUTH COPY of what lives on Dell at
#   /etc/rancher/k3s/config.yaml
#
# Plain English: Dell runs the app, test jobs, and the external database host.
# Kubernetes must not schedule pods against all of Dell's CPU and memory. These
# kubelet settings reserve 1 CPU and 2 GiB total memory for the operating system,
# the k3s agent, and non-pod host services such as Postgres. They also tell
# kubelet to start evicting lower-priority pods before memory or local disk is
# critically low.
kubelet-arg:
  - "system-reserved=cpu=500m,memory=1Gi"
  - "kube-reserved=cpu=500m,memory=1Gi"
  - "eviction-hard=memory.available<500Mi,nodefs.available<10%"
  - "eviction-soft=memory.available<1Gi,nodefs.available<15%"
  - "eviction-soft-grace-period=memory.available=1m,nodefs.available=1m"
