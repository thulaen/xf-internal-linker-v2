# In-cluster stable address for the database, inside the observability namespace
# (SLICE-21).
#
# Plain English: two monitoring tools need the database — postgres-exporter
# (reads database health metrics) and GlitchTip (stores error reports). The
# database lives directly on the Dell machine, outside Kubernetes. This gives
# the monitoring namespace its OWN name "postgres" pointing at Dell's database
# over the private cable (10.10.10.92:5432), so those tools don't depend on the
# app namespace's copy. Same "Service without a selector + manual Endpoints"
# pattern as k8s/database/postgres-external-service.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: xf-obs
  labels:
    app: postgres
    tier: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  namespace: xf-obs
  labels:
    app: postgres
subsets:
  - addresses:
      - ip: 10.10.10.92   # Dell's wired (private cable) address
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
