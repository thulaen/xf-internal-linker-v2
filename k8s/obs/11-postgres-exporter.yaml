# PostgreSQL metrics exporter (SLICE-21).
#
# Plain English: reads health numbers out of the database (connections, locks,
# table sizes, replication) and publishes them on port 9187 so vmagent can
# scrape them into VictoriaMetrics.
#
# It connects to the database through the observability namespace's own
# "postgres" Service, which points straight at the Dell host (see
# 04-postgres-external-service.yaml). The connection string is assembled from
# the synced postgres-credentials Secret using Kubernetes' $(VAR) expansion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: xf-obs
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      priorityClassName: xf-obs
      nodeSelector:
        kubernetes.io/hostname: dell-ubuntu-01-optiplex-micro-7010
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            # Assembled from the three vars above (Kubernetes $(VAR) expansion).
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.xf-obs.svc.cluster.local:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
            - name: PG_EXPORTER_EXCLUDE_DATABASES
              value: "template0,template1,postgres,test_xf_linker"
          ports:
            - containerPort: 9187
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: xf-obs
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: 9187
      protocol: TCP
