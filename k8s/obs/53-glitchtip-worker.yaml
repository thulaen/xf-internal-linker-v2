# GlitchTip — error tracking, background worker (SLICE-21).
#
# Plain English: the part of GlitchTip that processes incoming error events in
# the background (Celery worker + scheduler). Same connection settings as the
# web service. No port — it only consumes from the queue.
#
# ABSOLUTE-protected: one of the four required GlitchTip workloads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-worker
  namespace: xf-obs
  labels:
    app: glitchtip-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-worker
  template:
    metadata:
      labels:
        app: glitchtip-worker
    spec:
      priorityClassName: xf-obs
      nodeSelector:
        kubernetes.io/hostname: dell-ubuntu-01-optiplex-micro-7010
      containers:
        - name: worker
          image: glitchtip/glitchtip:latest
          imagePullPolicy: IfNotPresent
          command: ["./bin/run-celery-with-beat.sh"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.xf-obs.svc.cluster.local:5432/glitchtip"
            - name: REDIS_URL
              value: "redis://redis.xf-app.svc.cluster.local:6379/4"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glitchtip-secrets
                  key: SECRET_KEY
            - name: EMAIL_URL
              value: "consolemail://"
            - name: GLITCHTIP_DOMAIN
              value: "http://192.168.0.91:30137"
            - name: DEFAULT_FROM_EMAIL
              value: "glitchtip@localhost"
            - name: CELERY_WORKER_AUTOSCALE
              value: "1,3"
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: "10000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
