# Grafana — the dashboards UI (SLICE-21).
#
# Plain English: the website where you look at all the monitoring — metrics
# charts, logs, traces, profiles. Its data sources and dashboards are
# "provisioned" (defined as files, mounted from ConfigMaps), so they come back
# automatically; the only thing it stores on disk is its small SQLite database
# (users, preferences, annotations).
#
# Storage choice: grafana-data is on the fast SSD on Dell (ssd-hot), NOT the
# Mint NFS share, because Grafana's SQLite needs reliable file locking and
# SQLite-over-NFS is known to misbehave. Grafana is pinned to Dell anyway.
#
# Data-source URLs are the docker-compose datasources.yaml with the hostnames
# changed to cluster service names; the Pyroscope URL drops the old
# MINT_OBSERVABILITY_HOST LAN-IP indirection (kube-DNS + the Mint nodeSelector
# replace it). Reach it during the rehearsal at http://192.168.0.91:30030.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: xf-obs
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        uid: tempo
        url: http://tempo:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -30s
            spanEndTimeShift: 30s
            tags:
              - key: service.name
                value: service
            filterByTraceID: true
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki
        editable: false
      - name: Loki
        type: loki
        access: proxy
        uid: loki
        url: http://loki:3100
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "traceID=(\\w+)"
              name: traceID
              url: "$${__value.raw}"
        editable: false
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        uid: pyroscope
        url: http://pyroscope:4040
        editable: false
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: prometheus
        url: http://otel-collector:8889
        jsonData:
          httpMethod: GET
        editable: false
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        uid: victoriametrics
        url: http://vmsingle:8428
        isDefault: true
        jsonData:
          httpMethod: GET
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: xf-obs
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: xf-linker
        orgId: 1
        folder: ""
        folderUid: ""
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: xf-obs
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ssd-hot
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: xf-obs
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      priorityClassName: xf-obs
      nodeSelector:
        kubernetes.io/hostname: dell-ubuntu-01-optiplex-micro-7010
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_INSTALL_PLUGINS
              value: ""
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: xf-obs
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-ext
  namespace: xf-obs
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
      protocol: TCP
