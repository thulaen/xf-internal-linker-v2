apiVersion: v1
kind: Namespace
metadata:
  name: xf-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xf-coordinator
  namespace: xf-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xf-coordinator
  namespace: xf-test
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xf-coordinator
  namespace: xf-test
subjects:
  - kind: ServiceAccount
    name: xf-coordinator
    namespace: xf-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xf-coordinator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xf-shard-runner
  namespace: xf-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xf-merge
  namespace: xf-test
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xf-merge
  namespace: xf-test
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xf-merge
  namespace: xf-test
subjects:
  - kind: ServiceAccount
    name: xf-merge
    namespace: xf-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xf-merge
