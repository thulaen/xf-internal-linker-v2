# Loki — log aggregation database for the XF Internal Linker stack.
# Single-binary filesystem-backed mode. Default-on alongside GlitchTip
# + Pyroscope + otel-collector. Logs ship in via Grafana Alloy (see
# `config.alloy` and the `alloy` service in docker-compose.yml).
#
# 30-day retention, in-memory ring (the operator's laptop is one node).
# See plan docs/plans/does-adding-qodana-make-swift-wall.md Stream 4.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h          # 30 days — same as audit_errorlog
  reject_old_samples: true
  reject_old_samples_max_age: 720h # Accept Docker replay for the full retention window.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

ruler:
  alertmanager_url: ""            # No alertmanager — alerts route through AutoIssue.

analytics:
  reporting_enabled: false        # Don't phone home to Grafana Labs.
