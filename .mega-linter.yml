# MegaLinter — scoped quality gate.
# VALIDATE_ALL_CODEBASE=false means it only checks files that changed
# (detected via git diff) or that are passed via MEGALINTER_FILES_TO_LINT.
# Runs on both Windows (Docker Desktop) and Mint (Mint Docker) — same image.
# Source: https://megalinter.io/latest/configuration/

VALIDATE_ALL_CODEBASE: false
DISABLE_ERRORS: false
APPLY_FIXES: none
PARALLEL: true
SHOW_ELAPSED_TIME: true

# Disable linters already covered by dedicated quality scripts so there
# are no duplicate findings or conflicting configs.
DISABLE:
  - PYTHON_RUFF          # run-python-quality.sh
  - PYTHON_PYLINT        # run-python-quality.sh
  - PYTHON_BANDIT        # run-python-quality.sh
  - RUST_CLIPPY          # run-rust-quality.sh
  - RUST_RUSTFMT         # run-rust-quality.sh
  - TYPESCRIPT_ES        # run-angular-quality.sh
  - REPOSITORY_JSCPD     # PyO3 extension boilerplate triggers 0% threshold; tracked via AutoIssues
  - REPOSITORY_GRYPE     # CVE scan of transitive deps; tracked via pip-audit/cargo-audit in quality scripts

# Enable linters that add value not covered elsewhere
ENABLE:
  - REPOSITORY_SECRETLINT   # accidentally committed secrets / API keys
  - REPOSITORY_GITLEAKS     # secrets in git history
  - REPOSITORY_SEMGREP      # custom architecture rules from .semgrep/rules/
  - SHELL_SHELLCHECK        # shell script safety
  - SHELL_SHFMT             # shell script format
  - DOCKERFILE_HADOLINT     # Dockerfile best practices
  - YAML_YAMLLINT           # YAML syntax
  - JSON_JSONLINT           # JSON syntax
  - TOML_TAPLO              # TOML format
  - MARKDOWN_MARKDOWNLINT   # Markdown lint
  - SPELL_CSPELL            # spell check

EXCLUDED_DIRECTORIES:
  - node_modules
  - .git
  - dist
  - build
  - __pycache__
  - .mypy_cache
  - .pytest_cache
  - services/speccheck/target
  - frontend/node_modules
  - backend/reports
