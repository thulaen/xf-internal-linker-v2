# golangci-lint config — Phase 8 of the test-hardening plan.
#
# Strict preset for any future Go service this repo adds. No Go code
# lives here yet; this file documents the standard so the first Go
# service inherits it on day 1. Same ratchet philosophy as
# backend/ruff.toml: enable everything we know to be valuable, ignore
# only the rules that conflict with project conventions, shrink the
# ignore list incrementally.
#
# Run locally:
#   golangci-lint run ./...
# CI: the cpp-clang-tidy job's Go equivalent (`go-lint`) lands in
# .github/workflows/ci.yml the moment the first .go file appears.

run:
  timeout: 5m
  tests: true
  concurrency: 2  # honour MAX_JOBS_HEAVY policy from hardware_profile.py

linters:
  disable-all: true
  enable:
    # Built-ins
    - gofmt          # canonical formatting
    - goimports      # import ordering + grouping
    - govet          # standard `go vet` checks
    - errcheck       # unchecked error returns
    - ineffassign    # ineffective assignments
    - staticcheck    # successor to megacheck
    - unused         # unused variables / fields / functions

    # Bug detectors
    - bodyclose      # net/http response.Body close-on-exit
    - contextcheck   # context.Context propagation
    - nilerr         # `return nil` when err != nil
    - rowserrcheck   # database/sql rows.Err() check
    - sqlclosecheck  # database/sql Rows / Stmt close

    # Code quality
    - gocyclo        # cyclomatic complexity
    - gocognit       # cognitive complexity
    - funlen         # function length cap
    - dupl           # duplicate code blocks
    - misspell       # English-language spell check
    - prealloc       # find slice declarations that could preallocate
    - unconvert      # remove unnecessary type conversions
    - whitespace     # leading/trailing whitespace
    - wsl            # whitespace style

    # Security
    - gosec          # Go security checker

    # Modernisation
    - revive         # successor to golint; configurable
    - stylecheck     # Go style checks

linters-settings:
  gocyclo:
    min-complexity: 10
  gocognit:
    min-complexity: 15
  funlen:
    lines: 50      # matches the 50-line cap in CLAUDE.md
    statements: 40
  dupl:
    threshold: 100
  misspell:
    locale: US
  revive:
    severity: warning
    rules:
      - name: indent-error-flow
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: var-naming
      - name: range-val-in-closure

issues:
  exclude-rules:
    # Test files: relax some rules.
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - gocognit
        - dupl
        - gosec
    # Generated code: skip entirely.
    - path: \.pb\.go
      linters: [stylecheck, revive, unused]
  max-issues-per-linter: 0
  max-same-issues: 0
