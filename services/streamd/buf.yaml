version: v2
# Slice 1.5 - exempt the streamd contract from strict enum-prefix lints. The
# health-status enum follows the gRPC health-check convention (UNKNOWN /
# SERVING / NOT_SERVING) which buf's DEFAULT lint set wants prefixed
# (SERVING_STATUS_*). Renaming would diverge from the standard gRPC pattern
# every Python/Go client expects. Tracked for follow-up alignment.
lint:
  use:
    - MINIMAL
  except:
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - SERVICE_SUFFIX
    - RPC_RESPONSE_STANDARD_NAME
    - PACKAGE_DIRECTORY_MATCH
