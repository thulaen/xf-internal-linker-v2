# Slice 1.6 — staticcheck overrides for sidecars.
#
# SA1019 (deprecated symbol) is silenced for the same reason as streamd —
# grpc-go v1.66 deprecated DialContext + WithBlock in favour of NewClient,
# but migrating the Unix-socket custom dialer is a separate slice. The
# sidecars-healthcheck binary uses the same pattern as streamd-healthcheck.
#
# Documentation: https://staticcheck.dev/docs/configuration/options/
checks = ["all", "-SA1019"]
