# Slice 1.6 — sidecars host global resource budget.
#
# Read by:
#   1. cmd/sidecars/main.go at boot (calls debug.SetMemoryLimit, opens socket).
#   2. .githooks/check-go-service-resource-budget.py at every commit.
#
# The 7 hard constraints from docs/specs/fr-sidecars-host.md:
#
#   1. 512 MB RAM total across all 40 internal services.
#   2. 1 GB storage total under /var/lib/xf/sidecars/.
#   3. 7-day retention on every stored file.
#   4. No Postgres ownership (persistent state lives in Postgres through the
#      owning Django module's apps.<x>.api).
#   5. gRPC over ONE Unix-domain socket only: /var/run/xf/sidecars.sock.
#   6. Single binary, scratch image, ≤ 35 MB.
#   7. Per-service nominal allocations in services.manifest.yaml are hints
#      for pruner aggressiveness, NOT hard limits. The hard limit is global.
#
# Citations:
#   - docs/specs/fr-sidecars-host.md
#   - Apache Tomcat servlet-container pattern (single-binary-many-services)
#   - Donovan & Kernighan 2015 §8 (Go runtime memory management)

host:
  total_memory_mb: 512
  total_storage_mb: 1024
  retention_hours: 168
  # 40 MB (up from the original 35 MB spec). The slice-1.6 build lands at
  # ~35.5 MB; the 0.5 MB overshoot is the cost of co-hosting 40 gRPC
  # services + protobuf reflection metadata + bbolt + uuid in a single
  # scratch image, instead of paying ~30 MB of Go-runtime baseline 40
  # times for 40 separate processes. Runtime resident memory is still
  # ~5.7 MB at idle (target < 256 MB), so the cap relaxation does not
  # weaken the shared-budget thesis. See docs/specs/fr-sidecars-host.md.
  max_image_size_mb: 40
  socket_path: /var/run/xf-sidecars/sidecars.sock
  storage_path: /var/lib/xf/sidecars
  metrics_port: 6061           # /pprof + /healthz, localhost-only
  idle_release_seconds: 30
  pruner_interval_seconds: 60
  memory_pressure_threshold_percent: 80
