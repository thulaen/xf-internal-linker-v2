// Slice 1.6 — drilld skeleton contract.
// Apache reference: Drill. Owning Django module: governance.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Drilld {
  rpc ValidateJSON(DrilldValidateJSONRequest) returns (DrilldValidationReport);
  rpc RegisterReadSchema(DrilldReadSchema) returns (DrilldReadSchema);
  rpc Read(DrilldReadRequest) returns (stream DrilldDrillRow);
  rpc Health(Empty) returns (HealthReply);
}

message DrilldDrillRow {}
message DrilldReadRequest {}
message DrilldReadSchema {}
message DrilldValidateJSONRequest {}
message DrilldValidationReport {}
