// Slice 1.6 — pressured skeleton contract.
// Apache reference: NiFi backpressure. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Pressured {
  rpc Report(PressuredReportPressureRequest) returns (Ack);
  rpc Check(PressuredCheckPressureRequest) returns (PressuredPressureStatus);
  rpc Subscribe(PressuredSubscribeRequest) returns (stream PressuredPressureEvent);
  rpc Health(Empty) returns (HealthReply);
}

message PressuredCheckPressureRequest {}
message PressuredPressureEvent {}
message PressuredPressureStatus {}
message PressuredReportPressureRequest {}
message PressuredSubscribeRequest {}
