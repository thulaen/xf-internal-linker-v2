// Slice 1.6 — smd skeleton contract.
// Apache reference: Helix + Pekko. Owning Django module: suggestions.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Smd {
  rpc RegisterMachine(SmdStateMachine) returns (SmdStateMachine);
  rpc Transition(SmdTransitionRequest) returns (SmdTransitionAck);
  rpc GetState(SmdGetStateRequest) returns (SmdMachineState);
  rpc History(SmdHistoryRequest) returns (SmdHistoryReply);
  rpc Health(Empty) returns (HealthReply);
}

message SmdGetStateRequest {}
message SmdHistoryReply {}
message SmdHistoryRequest {}
message SmdMachineState {}
message SmdStateMachine {}
message SmdTransitionAck {}
message SmdTransitionRequest {}
