// Slice 1.6 — lookupd skeleton contract.
// Apache reference: Druid lookups. Owning Django module: pipeline.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Lookupd {
  rpc Set(LookupdSetLookupRequest) returns (Ack);
  rpc Get(LookupdGetLookupRequest) returns (LookupdLookupValue);
  rpc Reload(LookupdReloadRequest) returns (Ack);
  rpc List(Empty) returns (LookupdLookupList);
  rpc Health(Empty) returns (HealthReply);
}

message LookupdGetLookupRequest {}
message LookupdLookupList {}
message LookupdLookupValue {}
message LookupdReloadRequest {}
message LookupdSetLookupRequest {}
