// Slice 1.6 — arrowd skeleton contract.
// Apache reference: Arrow + Flight. Owning Django module: analytics.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Arrowd {
  rpc DoGet(ArrowdFlightTicket) returns (stream ArrowdFlightData);
  rpc DoPut(stream ArrowdFlightData) returns (ArrowdPutResult);
  rpc ListFlights(ArrowdFlightCriteria) returns (ArrowdFlightInfo);
  rpc GetSchema(ArrowdSchemaRequest) returns (ArrowdFlightSchema);
  rpc Health(Empty) returns (HealthReply);
}

message ArrowdFlightCriteria {}
message ArrowdFlightData {}
message ArrowdFlightInfo {}
message ArrowdFlightSchema {}
message ArrowdFlightTicket {}
message ArrowdPutResult {}
message ArrowdSchemaRequest {}
