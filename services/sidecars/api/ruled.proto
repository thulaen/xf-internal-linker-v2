// Slice 1.6 — ruled skeleton contract.
// Apache reference: HertzBeat + Eagle. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Ruled {
  rpc RegisterRule(RuledRule) returns (RuledRule);
  rpc Evaluate(RuledEvaluateRequest) returns (RuledEvaluateResult);
  rpc ListRules(Empty) returns (RuledRuleList);
  rpc RemoveRule(RuledRemoveRequest) returns (Ack);
  rpc Subscribe(RuledSubscribeRequest) returns (stream RuledRuleEvent);
  rpc Health(Empty) returns (HealthReply);
}

message RuledEvaluateRequest {}
message RuledEvaluateResult {}
message RuledRemoveRequest {}
message RuledRule {}
message RuledRuleEvent {}
message RuledRuleList {}
message RuledSubscribeRequest {}
