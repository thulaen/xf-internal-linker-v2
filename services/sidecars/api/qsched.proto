// Slice 1.6 — qsched skeleton contract.
// Apache reference: YARN + YuniKorn. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Qsched {
  rpc SubmitTask(QschedTaskSpec) returns (QschedTaskID);
  rpc NextTask(QschedNextTaskRequest) returns (QschedTaskSpec);
  rpc SetWeights(QschedWeightsRequest) returns (Ack);
  rpc Stats(Empty) returns (QschedSchedStats);
  rpc Health(Empty) returns (HealthReply);
}

message QschedNextTaskRequest {}
message QschedSchedStats {}
message QschedTaskID {}
message QschedTaskSpec {}
message QschedWeightsRequest {}
