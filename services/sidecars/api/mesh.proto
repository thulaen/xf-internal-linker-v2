// Slice 1.6 — mesh skeleton contract.
// Apache reference: EventMesh + Camel. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Mesh {
  rpc Publish(MeshPublishRequest) returns (Ack);
  rpc Subscribe(MeshSubscribeRequest) returns (stream MeshMeshEvent);
  rpc AddRoute(MeshMeshRoute) returns (MeshMeshRoute);
  rpc ListRoutes(Empty) returns (MeshMeshRouteList);
  rpc Health(Empty) returns (HealthReply);
}

message MeshMeshEvent {}
message MeshMeshRoute {}
message MeshMeshRouteList {}
message MeshPublishRequest {}
message MeshSubscribeRequest {}
