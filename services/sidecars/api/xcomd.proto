// Slice 1.6 — xcomd skeleton contract.
// Apache reference: Airflow XCom. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Xcomd {
  rpc Push(XcomdXComPushRequest) returns (Ack);
  rpc Pull(XcomdXComPullRequest) returns (XcomdXComValue);
  rpc List(XcomdXComListRequest) returns (XcomdXComKeyList);
  rpc Forget(XcomdXComForgetRequest) returns (Ack);
  rpc Health(Empty) returns (HealthReply);
}

message XcomdXComForgetRequest {}
message XcomdXComKeyList {}
message XcomdXComListRequest {}
message XcomdXComPullRequest {}
message XcomdXComPushRequest {}
message XcomdXComValue {}
