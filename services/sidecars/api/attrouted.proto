// Slice 1.6 — attrouted contract.
//
// attrouted decides which Celery queue or handler a work unit goes to based
// on declarative attribute rules. Replay re-runs a past decision so a
// vibe-coder can see why a particular task landed where it did.

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Attrouted {
  rpc Route(RouteRequest) returns (RouteDecision);
  rpc RegisterRule(RouteRule) returns (RouteRule);
  rpc ListRules(Empty) returns (RouteRuleList);
  rpc RemoveRule(RemoveRuleRequest) returns (Ack);
  rpc Replay(ReplayRequest) returns (ReplayReport);
  rpc Health(Empty) returns (HealthReply);
}

message RouteRequest {
  // source: e.g., "sync" | "crawler" | "content_write" | "webhook" | "suggestion".
  string source = 1;
  // attributes: free-form key/value map (e.g., {"source_type":"xenforo","priority":"high"}).
  map<string, string> attributes = 2;
  // unit_id: optional; if present, the decision is recorded in the replay log.
  string unit_id = 3;
}

message RouteDecision {
  // matched_rule_id: empty when no rule matched and the default path fired.
  string matched_rule_id = 1;
  // target: the celery queue name or handler symbol.
  string target = 2;
  // explanation: plain-English reason ("matched rule sync→xf_priority because source_type=xenforo + priority=high").
  string explanation = 3;
}

message RouteRule {
  string id = 1;
  string source = 2;
  // Match rules are simple equality on attribute keys. Empty value = "any".
  map<string, string> match_attributes = 3;
  string target = 4;
  // priority: rules evaluated in descending priority order; first match wins.
  int32 priority = 5;
  bool enabled = 6;
}

message RouteRuleList {
  repeated RouteRule items = 1;
}

message RemoveRuleRequest {
  string rule_id = 1;
}

message ReplayRequest {
  string unit_id = 1;
}

message ReplayReport {
  string unit_id = 1;
  RouteDecision then_decision = 2;
  RouteDecision now_decision = 3;
  // Empty if the two match. Otherwise plain-English diff (rule renamed / removed / new rule wins).
  string diff_explanation = 4;
}
