// Slice 1.6 — aclsd skeleton contract.
// Apache reference: Ranger + Sentry. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Aclsd {
  rpc Evaluate(AclsdEvaluateRequest) returns (AclsdDecision);
  rpc AddPolicy(AclsdACLPolicy) returns (AclsdACLPolicy);
  rpc ListPolicies(Empty) returns (AclsdACLPolicyList);
  rpc RemovePolicy(AclsdRemoveRequest) returns (Ack);
  rpc Health(Empty) returns (HealthReply);
}

message AclsdACLPolicy {}
message AclsdACLPolicyList {}
message AclsdDecision {}
message AclsdEvaluateRequest {}
message AclsdRemoveRequest {}
