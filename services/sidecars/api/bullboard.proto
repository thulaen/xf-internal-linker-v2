// Slice 1.6 — bullboard contract.
//
// bullboard is the rolling "what is happening now" feed plus the
// threshold-rule promotion engine. The Channels bridge subscribes to the
// stream and republishes each bulletin via apps.realtime.api.broadcast so
// the operator UI sees it within 500 ms.

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Bullboard {
  rpc Post(PostBulletinRequest) returns (Bulletin);
  rpc Recent(RecentRequest) returns (BulletinList);
  rpc Subscribe(SubscribeRequest) returns (stream Bulletin);
  rpc RegisterThreshold(ThresholdRule) returns (ThresholdRule);
  rpc ListThresholds(Empty) returns (ThresholdRuleList);
  rpc RemoveThreshold(RemoveThresholdRequest) returns (Ack);
  rpc EvaluateNow(EvaluateNowRequest) returns (EvaluationReport);
  rpc PromoteToAutoIssue(PromoteRequest) returns (Ack);
  rpc Health(Empty) returns (HealthReply);
}

// Severity values use the SEV_ prefix because proto3 enum values share scope
// with the enclosing proto package — INFO/WARNING/ERROR/CRITICAL would
// collide with snapshotd's SnapshotKind enum.
enum Severity {
  SEV_UNKNOWN = 0;
  SEV_INFO = 1;
  SEV_WARNING = 2;
  SEV_ERROR = 3;
  SEV_CRITICAL = 4;
}

message Bulletin {
  string id = 1;
  string event_type = 2;
  Severity severity = 3;
  string message = 4;
  // Free-form JSON map of grouping fields (e.g., {"domain":"example.com"}).
  bytes context_json = 5;
  int64 posted_at_unix_nanos = 6;
  // If a threshold fired and an AutoIssue was created, this is its id.
  int64 linked_autoissue_id = 7;
}

message BulletinList {
  repeated Bulletin items = 1;
}

message PostBulletinRequest {
  string event_type = 1;
  Severity severity = 2;
  string message = 3;
  bytes context_json = 4;
}

message RecentRequest {
  string event_type = 1;
  Severity min_severity = 2;
  int32 limit = 3;
  int64 since_unix_nanos = 4;
}

message SubscribeRequest {
  // Empty event_type → all event types.
  string event_type = 1;
  Severity min_severity = 2;
}

message ThresholdRule {
  string id = 1;
  string event_type = 2;
  // window: e.g., "15m". count: how many in window before firing.
  string window = 3;
  int32 count = 4;
  // grouping_fields: list of context_json keys to group by (e.g., ["domain"]).
  repeated string grouping_fields = 5;
  string autoissue_template = 6;
  bool enabled = 7;
}

message ThresholdRuleList {
  repeated ThresholdRule items = 1;
}

message RemoveThresholdRequest {
  string rule_id = 1;
}

message EvaluateNowRequest {
  string rule_id = 1;
}

message EvaluationReport {
  string rule_id = 1;
  bool would_fire = 2;
  int32 matched_count = 3;
  string detail = 4;
}

message PromoteRequest {
  string rule_id = 1;
  string event_type = 2;
  bytes context_json = 3;
}
