// Slice 1.6 — hintd skeleton contract.
// Apache reference: Cassandra hinted handoff. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Hintd {
  rpc Buffer(HintdBufferRequest) returns (Ack);
  rpc Drain(HintdDrainRequest) returns (stream HintdHintEvent);
  rpc Stats(Empty) returns (HintdHintStats);
  rpc Forget(HintdForgetRequest) returns (Ack);
  rpc Health(Empty) returns (HealthReply);
}

message HintdBufferRequest {}
message HintdDrainRequest {}
message HintdForgetRequest {}
message HintdHintEvent {}
message HintdHintStats {}
