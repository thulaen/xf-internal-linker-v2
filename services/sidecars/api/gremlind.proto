// Slice 1.6 — gremlind skeleton contract.
// Apache reference: TinkerPop + Gremlin. Owning Django module: graph.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Gremlind {
  rpc Traverse(GremlindTraverseRequest) returns (stream GremlindTraversalResult);
  rpc Path(GremlindPathRequest) returns (GremlindPathResult);
  rpc Neighborhood(GremlindNeighborhoodRequest) returns (GremlindNeighborhoodResult);
  rpc Count(GremlindCountRequest) returns (GremlindCountResult);
  rpc Health(Empty) returns (HealthReply);
}

message GremlindCountRequest {}
message GremlindCountResult {}
message GremlindNeighborhoodRequest {}
message GremlindNeighborhoodResult {}
message GremlindPathRequest {}
message GremlindPathResult {}
message GremlindTraversalResult {}
message GremlindTraverseRequest {}
