// Slice 1.6 — extractd skeleton contract.
// Apache reference: Tika. Owning Django module: sources.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Extractd {
  rpc Extract(ExtractdExtractRequest) returns (ExtractdExtractedDoc);
  rpc ExtractURL(ExtractdExtractURLRequest) returns (ExtractdExtractedDoc);
  rpc DetectMIME(ExtractdDetectMIMERequest) returns (ExtractdMIMEReply);
  rpc OCR(ExtractdOCRRequest) returns (ExtractdOCRReply);
  rpc Health(Empty) returns (HealthReply);
}

message ExtractdDetectMIMERequest {}
message ExtractdExtractRequest {}
message ExtractdExtractURLRequest {}
message ExtractdExtractedDoc {}
message ExtractdMIMEReply {}
message ExtractdOCRReply {}
message ExtractdOCRRequest {}
