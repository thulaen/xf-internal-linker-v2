// Slice 1.6 — tieredd skeleton contract.
// Apache reference: Pulsar tiered. Owning Django module: content.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Tieredd {
  rpc Offload(TiereddOffloadRequest) returns (Ack);
  rpc Restore(TiereddRestoreRequest) returns (Ack);
  rpc ListCold(Empty) returns (TiereddColdList);
  rpc Stats(Empty) returns (TiereddTieredStats);
  rpc Health(Empty) returns (HealthReply);
}

message TiereddColdList {}
message TiereddOffloadRequest {}
message TiereddRestoreRequest {}
message TiereddTieredStats {}
