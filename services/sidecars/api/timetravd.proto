// Slice 1.6 — timetravd skeleton contract.
// Apache reference: Iceberg. Owning Django module: content.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Timetravd {
  rpc Snapshot(TimetravdSnapshotRequest) returns (TimetravdSnapshotID);
  rpc AsOf(TimetravdAsOfRequest) returns (TimetravdSnapshot);
  rpc Diff(TimetravdDiffRequest) returns (TimetravdDiffReport);
  rpc ListSnapshots(TimetravdListRequest) returns (stream TimetravdSnapshotID);
  rpc Health(Empty) returns (HealthReply);
}

message TimetravdAsOfRequest {}
message TimetravdDiffReport {}
message TimetravdDiffRequest {}
message TimetravdListRequest {}
message TimetravdSnapshot {}
message TimetravdSnapshotID {}
message TimetravdSnapshotRequest {}
