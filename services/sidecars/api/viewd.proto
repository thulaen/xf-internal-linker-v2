// Slice 1.6 — viewd skeleton contract.
// Apache reference: CouchDB views. Owning Django module: analytics.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Viewd {
  rpc RegisterView(ViewdViewSpec) returns (ViewdViewSpec);
  rpc Query(ViewdViewQuery) returns (ViewdViewResult);
  rpc Refresh(ViewdRefreshRequest) returns (Ack);
  rpc ListViews(Empty) returns (ViewdViewList);
  rpc Health(Empty) returns (HealthReply);
}

message ViewdRefreshRequest {}
message ViewdViewList {}
message ViewdViewQuery {}
message ViewdViewResult {}
message ViewdViewSpec {}
