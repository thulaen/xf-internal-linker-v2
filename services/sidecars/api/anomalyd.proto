// Slice 1.6 — anomalyd skeleton contract.
// Apache reference: Eagle. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Anomalyd {
  rpc Feed(AnomalydAnomalyFeedRequest) returns (Ack);
  rpc Subscribe(AnomalydSubscribeRequest) returns (stream AnomalydAnomalyEvent);
  rpc GetBaseline(AnomalydBaselineRequest) returns (AnomalydBaseline);
  rpc RegisterMetric(AnomalydMetricSpec) returns (AnomalydMetricSpec);
  rpc Health(Empty) returns (HealthReply);
}

message AnomalydAnomalyEvent {}
message AnomalydAnomalyFeedRequest {}
message AnomalydBaseline {}
message AnomalydBaselineRequest {}
message AnomalydMetricSpec {}
message AnomalydSubscribeRequest {}
