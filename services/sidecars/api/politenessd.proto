// Slice 1.6 — politenessd skeleton contract.
// Apache reference: Nutch. Owning Django module: sources.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Politenessd {
  rpc CheckAllowed(PolitenessdCheckAllowedRequest) returns (PolitenessdAllowedReply);
  rpc AcquireSlot(PolitenessdAcquireRequest) returns (PolitenessdSlotToken);
  rpc ReleaseSlot(PolitenessdReleaseRequest) returns (Ack);
  rpc RefreshRobots(PolitenessdRefreshRequest) returns (Ack);
  rpc Stats(Empty) returns (PolitenessdPolitenessStats);
  rpc Health(Empty) returns (HealthReply);
}

message PolitenessdAcquireRequest {}
message PolitenessdAllowedReply {}
message PolitenessdCheckAllowedRequest {}
message PolitenessdPolitenessStats {}
message PolitenessdRefreshRequest {}
message PolitenessdReleaseRequest {}
message PolitenessdSlotToken {}
