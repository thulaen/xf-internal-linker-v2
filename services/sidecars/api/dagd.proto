// Slice 1.6 — dagd skeleton contract.
// Apache reference: Airflow. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Dagd {
  rpc Register(DagdDAGSpec) returns (DagdDAGSpec);
  rpc Run(DagdRunDAGRequest) returns (DagdRunID);
  rpc Status(DagdStatusRequest) returns (DagdDAGStatus);
  rpc Visualise(DagdVisualiseRequest) returns (DagdVisualisedDAG);
  rpc History(DagdHistoryRequest) returns (stream DagdRunEvent);
  rpc Health(Empty) returns (HealthReply);
}

message DagdDAGSpec {}
message DagdDAGStatus {}
message DagdHistoryRequest {}
message DagdRunDAGRequest {}
message DagdRunEvent {}
message DagdRunID {}
message DagdStatusRequest {}
message DagdVisualiseRequest {}
message DagdVisualisedDAG {}
