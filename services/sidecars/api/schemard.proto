// Slice 1.6 — schemard contract.
//
// schemard is a small Avro-style schema registry. snapshotd consults
// CheckCompat at write time so an outdated reader cannot crash on a new
// schema version. Schemas are persisted to Bolt under
// /var/lib/xf/sidecars/schemard/state.db.

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Schemard {
  rpc Register(RegisterSchemaRequest) returns (SchemaVersion);
  rpc Get(GetSchemaRequest) returns (SchemaVersion);
  rpc ListVersions(ListVersionsRequest) returns (SchemaVersionList);
  rpc CheckCompat(CheckCompatRequest) returns (CompatReport);
  rpc Latest(LatestRequest) returns (SchemaVersion);
  rpc Health(Empty) returns (HealthReply);
}

message SchemaVersion {
  string subject = 1;        // e.g., "snapshotd.snapshot.v2"
  int32 version = 2;
  string schema_json = 3;
  int64 created_at_unix_nanos = 4;
}

message SchemaVersionList {
  repeated SchemaVersion items = 1;
}

message RegisterSchemaRequest {
  string subject = 1;
  string schema_json = 2;
  // require_compat: when true, server rejects the registration if the new
  // schema is not backward-compatible with the latest existing version.
  bool require_backward_compat = 3;
}

message GetSchemaRequest {
  string subject = 1;
  int32 version = 2;
}

message ListVersionsRequest {
  string subject = 1;
}

message LatestRequest {
  string subject = 1;
}

enum CompatLevel {
  COMP_UNKNOWN = 0;
  // COMP_BACKWARD: new schema can read old data (most common; default).
  COMP_BACKWARD = 1;
  // COMP_FORWARD: old schema can read new data.
  COMP_FORWARD = 2;
  // COMP_FULL: both directions.
  COMP_FULL = 3;
}

message CheckCompatRequest {
  string subject = 1;
  string candidate_schema_json = 2;
  CompatLevel level = 3;
}

message CompatReport {
  bool compatible = 1;
  string detail = 2;
  CompatLevel checked_level = 3;
}
