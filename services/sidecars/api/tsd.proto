// Slice 1.6 — tsd skeleton contract.
// Apache reference: Druid + Pinot. Owning Django module: analytics.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Tsd {
  rpc Ingest(TsdIngestRequest) returns (Ack);
  rpc Query(TsdTSDQuery) returns (TsdTSDQueryResult);
  rpc ListMetrics(Empty) returns (TsdMetricList);
  rpc Rollup(TsdRollupRequest) returns (TsdRollupResult);
  rpc Health(Empty) returns (HealthReply);
}

message TsdIngestRequest {}
message TsdMetricList {}
message TsdRollupRequest {}
message TsdRollupResult {}
message TsdTSDQuery {}
message TsdTSDQueryResult {}
