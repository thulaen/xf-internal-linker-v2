// Slice 1.6 — snapshotd contract.
//
// snapshotd is the durable evidence layer for AutoIssues. Snapshots are
// stored as Parquet files under /var/lib/xf/sidecars/snapshotd/.
//
// The 9 RPCs match docs/specs/fr-sidecars-host.md § snapshotd. The shape
// rejects payloads that would explode storage (per-row > 64 KiB, total
// per-snapshot > max_size_mb).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Snapshotd {
  rpc CreateSnapshot(CreateSnapshotRequest) returns (Snapshot);
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);
  rpc ListByIssue(ListByIssueRequest) returns (SnapshotList);
  rpc Compare(CompareRequest) returns (ComparisonReport);
  rpc Search(SearchRequest) returns (stream Snapshot);
  rpc Pin(PinRequest) returns (Snapshot);
  rpc Unpin(UnpinRequest) returns (Snapshot);
  rpc ReadRows(ReadRowsRequest) returns (stream SnapshotRow);
  rpc DiffBeforeAfter(DiffBeforeAfterRequest) returns (ComparisonReport);
  rpc Health(Empty) returns (HealthReply);
}

// Kind classifies the snapshot for the operator UI. before/after pair up for
// performance fixes; info/warning/error/critical are operator severity.
// Values use the SK_ prefix because proto3 enum values share scope with
// their parent's parent (here, the file-level xf.sidecars.v1 package).
enum SnapshotKind {
  SK_UNKNOWN = 0;
  SK_BEFORE = 1;
  SK_AFTER = 2;
  SK_INFO = 3;
  SK_WARNING = 4;
  SK_ERROR = 5;
  SK_CRITICAL = 6;
}

message Snapshot {
  string id = 1;
  int64 issue_id = 2;
  SnapshotKind kind = 3;
  string category = 4;
  string schema_version = 5;
  string path = 6;
  int64 row_count = 7;
  int64 size_bytes = 8;
  bool pinned = 9;
  int64 created_at_unix_nanos = 10;
  int64 last_touched_at_unix_nanos = 11;
}

message SnapshotList {
  repeated Snapshot items = 1;
}

message SnapshotRow {
  // Each row is a small JSON document (≤ 64 KiB). snapshotd rejects rows
  // above that size at write time.
  bytes payload_json = 1;
}

message CreateSnapshotRequest {
  int64 issue_id = 1;
  SnapshotKind kind = 2;
  string category = 3;
  string schema_version = 4;
  repeated SnapshotRow rows = 5;
  // Operator-set per-snapshot cap; 0 → server default (25 MiB).
  int32 max_size_mb = 6;
}

message GetSnapshotRequest {
  string id = 1;
}

message ListByIssueRequest {
  int64 issue_id = 1;
}

message CompareRequest {
  string before_id = 1;
  string after_id = 2;
}

message DiffBeforeAfterRequest {
  int64 issue_id = 1;
}

message ComparisonReport {
  string before_id = 1;
  string after_id = 2;
  repeated FieldDelta deltas = 3;
  string summary = 4;
  repeated string regressions = 5;
}

message FieldDelta {
  string field = 1;
  string before = 2;
  string after = 3;
  // direction: improved | regressed | unchanged
  string direction = 4;
}

message SearchRequest {
  // Filter by issue_id (0 → any), kind (KIND_UNKNOWN → any), and category
  // (empty → any). Pagination through `offset` + `limit`.
  int64 issue_id = 1;
  SnapshotKind kind = 2;
  string category = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message PinRequest {
  string snapshot_id = 1;
  int64 issue_id = 2;
}

message UnpinRequest {
  string snapshot_id = 1;
}

message ReadRowsRequest {
  string snapshot_id = 1;
  // 0 → all rows. Server-side max is 500 to bound the response size.
  int32 max_rows = 2;
}
