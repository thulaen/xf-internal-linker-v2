// Slice 1.6 — retentd skeleton contract.
// Apache reference: Falcon + Pulsar. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Retentd {
  rpc RegisterPolicy(RetentdRetentionPolicy) returns (RetentdRetentionPolicy);
  rpc GetPolicy(RetentdGetPolicyRequest) returns (RetentdRetentionPolicy);
  rpc ListPolicies(Empty) returns (RetentdRetentionList);
  rpc EnforceCheck(RetentdEnforceRequest) returns (RetentdEnforceReport);
  rpc Health(Empty) returns (HealthReply);
}

message RetentdEnforceReport {}
message RetentdEnforceRequest {}
message RetentdGetPolicyRequest {}
message RetentdRetentionList {}
message RetentdRetentionPolicy {}
