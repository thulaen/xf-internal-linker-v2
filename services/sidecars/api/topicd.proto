// Slice 1.6 — topicd skeleton contract.
// Apache reference: Kafka. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Topicd {
  rpc Produce(TopicdProduceRequest) returns (Ack);
  rpc Consume(TopicdConsumeRequest) returns (stream TopicdEvent);
  rpc Commit(TopicdCommitRequest) returns (Ack);
  rpc ListTopics(Empty) returns (TopicdTopicList);
  rpc Health(Empty) returns (HealthReply);
}

message TopicdCommitRequest {}
message TopicdConsumeRequest {}
message TopicdEvent {}
message TopicdProduceRequest {}
message TopicdTopicList {}
