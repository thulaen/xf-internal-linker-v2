// Slice 1.6 — coordd contract.
//
// coordd provides Zookeeper-style ephemeral nodes, exclusive locks, leader
// election, and service discovery. The bullboard bridge calls Elect at boot
// so only one Celery replica streams to apps.realtime.api.broadcast.

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Coordd {
  rpc CreateEphemeral(EphemeralRequest) returns (NodeID);
  rpc Watch(WatchRequest) returns (stream WatchEvent);
  rpc Lock(LockRequest) returns (LockToken);
  rpc Unlock(UnlockRequest) returns (Ack);
  rpc Elect(ElectRequest) returns (stream LeaderEvent);
  rpc Discover(DiscoverRequest) returns (ServiceList);
  rpc Health(Empty) returns (HealthReply);
}

message EphemeralRequest {
  string path = 1;
  bytes data = 2;
  // ttl_seconds: 0 → server default (30 s). Renewed via Watch heartbeats.
  int32 ttl_seconds = 3;
}

message NodeID {
  string id = 1;
  string path = 2;
  int64 created_at_unix_nanos = 3;
}

message WatchRequest {
  string path = 1;
  // recursive: also watch children of path.
  bool recursive = 2;
}

// WatchKind values are prefixed so they don't collide with LeaderKind in the
// same file (proto3 enum values are siblings of their type's enclosing scope).
enum WatchKind {
  WATCH_UNKNOWN = 0;
  WATCH_CREATED = 1;
  WATCH_UPDATED = 2;
  WATCH_DELETED = 3;
}

message WatchEvent {
  WatchKind kind = 1;
  string path = 2;
  bytes data = 3;
}

message LockRequest {
  string lock_name = 1;
  // hold_for_seconds: how long the lock survives without a renew.
  int32 hold_for_seconds = 2;
}

message LockToken {
  string token = 1;
  string lock_name = 2;
  int64 expires_at_unix_nanos = 3;
}

message UnlockRequest {
  string token = 1;
}

message ElectRequest {
  string group = 1;
  string candidate_id = 2;
}

enum LeaderKind {
  LEAD_UNKNOWN = 0;
  LEAD_BECAME = 1;
  LEAD_LOST = 2;
  LEAD_CHANGED = 3;
}

message LeaderEvent {
  LeaderKind kind = 1;
  string group = 2;
  string leader_id = 3;
}

message DiscoverRequest {
  string group = 1;
}

message ServiceList {
  repeated string members = 1;
  string current_leader = 2;
}
