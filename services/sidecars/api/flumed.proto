// Slice 1.6 — flumed skeleton contract.
// Apache reference: Flume. Owning Django module: sources.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Flumed {
  rpc Ingest(FlumedFlumeEvent) returns (Ack);
  rpc AddInterceptor(FlumedInterceptor) returns (FlumedInterceptor);
  rpc RemoveInterceptor(FlumedRemoveRequest) returns (Ack);
  rpc Subscribe(FlumedSubscribeRequest) returns (stream FlumedFlumeEvent);
  rpc Health(Empty) returns (HealthReply);
}

message FlumedFlumeEvent {}
message FlumedInterceptor {}
message FlumedRemoveRequest {}
message FlumedSubscribeRequest {}
