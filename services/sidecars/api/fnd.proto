// Slice 1.6 — fnd skeleton contract.
// Apache reference: Pulsar Functions + OpenWhisk. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Fnd {
  rpc Register(FndFunctionSpec) returns (FndFunctionSpec);
  rpc Invoke(FndInvokeRequest) returns (FndInvokeResult);
  rpc List(Empty) returns (FndFunctionList);
  rpc Logs(FndLogsRequest) returns (stream FndLogLine);
  rpc Health(Empty) returns (HealthReply);
}

message FndFunctionList {}
message FndFunctionSpec {}
message FndInvokeRequest {}
message FndInvokeResult {}
message FndLogLine {}
message FndLogsRequest {}
