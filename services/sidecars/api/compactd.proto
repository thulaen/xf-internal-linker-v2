// Slice 1.6 — compactd skeleton contract.
// Apache reference: Hudi compaction. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Compactd {
  rpc ScheduleCompaction(CompactdCompactionRequest) returns (CompactdCompactionID);
  rpc Status(CompactdStatusRequest) returns (CompactdCompactionStatus);
  rpc RunNow(CompactdRunNowRequest) returns (Ack);
  rpc Stats(Empty) returns (CompactdCompactionStats);
  rpc Health(Empty) returns (HealthReply);
}

message CompactdCompactionID {}
message CompactdCompactionRequest {}
message CompactdCompactionStats {}
message CompactdCompactionStatus {}
message CompactdRunNowRequest {}
message CompactdStatusRequest {}
