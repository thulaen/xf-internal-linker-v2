// Slice 1.6 — provd skeleton contract.
// Apache reference: NiFi + Atlas. Owning Django module: operations.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Provd {
  rpc RecordOrigin(ProvdRecordOriginRequest) returns (Ack);
  rpc RecordStage(ProvdRecordStageRequest) returns (Ack);
  rpc GetLineage(ProvdGetLineageRequest) returns (ProvdLineageGraph);
  rpc Search(ProvdSearchRequest) returns (stream ProvdLineageEntry);
  rpc Health(Empty) returns (HealthReply);
}

message ProvdGetLineageRequest {}
message ProvdLineageEntry {}
message ProvdLineageGraph {}
message ProvdRecordOriginRequest {}
message ProvdRecordStageRequest {}
message ProvdSearchRequest {}
