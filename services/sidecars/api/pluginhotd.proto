// Slice 1.6 — pluginhotd skeleton contract.
// Apache reference: OpenWhisk. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Pluginhotd {
  rpc Reload(PluginhotdReloadRequest) returns (Ack);
  rpc Status(PluginhotdStatusRequest) returns (PluginhotdPluginStatus);
  rpc Rollback(PluginhotdRollbackRequest) returns (Ack);
  rpc ListLoaded(Empty) returns (PluginhotdPluginList);
  rpc Sandbox(PluginhotdSandboxRequest) returns (PluginhotdSandboxResult);
  rpc Health(Empty) returns (HealthReply);
}

message PluginhotdPluginList {}
message PluginhotdPluginStatus {}
message PluginhotdReloadRequest {}
message PluginhotdRollbackRequest {}
message PluginhotdSandboxRequest {}
message PluginhotdSandboxResult {}
message PluginhotdStatusRequest {}
