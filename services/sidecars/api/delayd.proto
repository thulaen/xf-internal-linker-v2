// Slice 1.6 — delayd skeleton contract.
// Apache reference: RocketMQ delayed. Owning Django module: platform.
// Ships as a gRPC skeleton this slice; every RPC returns codes.Unimplemented.
// Real RPC bodies fill in via a future session — tracked in the paper-trail under
// the tag `sidecars_followup`. Message names are service-prefixed because every
// .proto file lives in the same proto package (xf.sidecars.v1).

syntax = "proto3";

package xf.sidecars.v1;

import "shared.proto";

option go_package = "xf-internal-linker-v2/services/sidecars/api/gen;sidecarsv1";

service Delayd {
  rpc Schedule(DelaydScheduleRequest) returns (DelaydScheduleID);
  rpc Cancel(DelaydCancelRequest) returns (Ack);
  rpc Drain(DelaydDrainRequest) returns (stream DelaydDelayedEvent);
  rpc Stats(Empty) returns (DelaydDelayStats);
  rpc Health(Empty) returns (HealthReply);
}

message DelaydCancelRequest {}
message DelaydDelayStats {}
message DelaydDelayedEvent {}
message DelaydDrainRequest {}
message DelaydScheduleID {}
message DelaydScheduleRequest {}
