# Slice 1.6 — sidecars host manifest.
#
# Single source of truth for the 40 Apache-pattern internal services
# co-hosted in the sidecars Go binary. cmd/sidecars/main.go reads this at
# boot to register each service against the shared gRPC server.
#
# Per-service memory_share_mb and storage_share_mb are HINTS for the
# pruner's eviction aggressiveness, NOT hard caps. The hard caps are global
# (512 MB RAM, 1 GB storage) declared in host: below and enforced by
# internal/shared/budget + internal/shared/pruner.
#
# The 6 services marked implemented: true ship with real RPC logic this
# slice. The other 34 ship with gRPC skeletons returning codes.Unimplemented
# + one paper-trail entry tagged `sidecars_followup` per service.

host:
  total_memory_mb: 512
  total_storage_mb: 1024
  retention_hours: 168
  max_image_size_mb: 35
  socket_path: /var/run/xf-sidecars/sidecars.sock
  storage_path: /var/lib/xf/sidecars
  metrics_port: 6061
  idle_release_seconds: 30
  pruner_interval_seconds: 60
  memory_pressure_threshold_percent: 80

services:
  # ----- IMPLEMENTED (6) -----

  - name: snapshotd
    apache: "Parquet + Iceberg manifest"
    owning_module: governance
    memory_share_mb: 96
    storage_share_mb: 384
    priority: high
    implemented: true
    rpcs:
      - {name: CreateSnapshot,    in: CreateSnapshotRequest,    out: Snapshot,           streaming: none}
      - {name: GetSnapshot,       in: GetSnapshotRequest,       out: Snapshot,           streaming: none}
      - {name: ListByIssue,       in: ListByIssueRequest,       out: SnapshotList,       streaming: none}
      - {name: Compare,           in: CompareRequest,           out: ComparisonReport,   streaming: none}
      - {name: Search,            in: SearchRequest,            out: Snapshot,           streaming: server}
      - {name: Pin,               in: PinRequest,               out: Snapshot,           streaming: none}
      - {name: Unpin,             in: UnpinRequest,             out: Snapshot,           streaming: none}
      - {name: ReadRows,          in: ReadRowsRequest,          out: SnapshotRow,        streaming: server}
      - {name: DiffBeforeAfter,   in: DiffBeforeAfterRequest,   out: ComparisonReport,   streaming: none}
      - {name: Health,            in: Empty,                    out: HealthReply,        streaming: none}

  - name: bullboard
    apache: "NiFi bulletin board"
    owning_module: operations
    memory_share_mb: 32
    storage_share_mb: 128
