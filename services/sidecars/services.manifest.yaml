      - {name: Recent,                in: RecentRequest,              out: BulletinList,        streaming: none}
      - {name: Subscribe,             in: SubscribeRequest,           out: Bulletin,            streaming: server}
      - {name: RegisterThreshold,     in: ThresholdRule,              out: ThresholdRule,       streaming: none}
      - {name: ListThresholds,        in: Empty,                      out: ThresholdRuleList,   streaming: none}
      - {name: RemoveThreshold,       in: RemoveThresholdRequest,     out: Ack,                 streaming: none}
      - {name: EvaluateNow,           in: EvaluateNowRequest,         out: EvaluationReport,    streaming: none}
      - {name: PromoteToAutoIssue,    in: PromoteRequest,             out: Ack,                 streaming: none}
      - {name: Health,                in: Empty,                      out: HealthReply,         streaming: none}

  - name: attrouted
