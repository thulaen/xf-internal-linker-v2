# Mull configuration for scoped C++ mutation testing.
#
# Mull is enabled only on focused native test binaries. Do not run it over the
# whole extension tree by default.

excludePaths:
  - tests/**
  - benchmarks/**
  - build*/**

mutators:
  - cxx_relational_replacement
  - cxx_logical_or_to_and
  - cxx_arithmetic_replacement
  - remove_void_call

timeout: 30000
parallel-jobs: 2
