# Staged-cluster nginx config: serve the Angular SPA and proxy the API +
# WebSocket + Django static/media to the in-cluster backend Service
# (`backend:8000` in namespace xf-app). The browser only ever talks to nginx
# (same origin), so there is no CORS.
#
# Serves BOTH plain HTTP on 80 and HTTPS on 443 from one server block. The TLS
# cert is a SELF-SIGNED staging cert, mounted from the `frontend-tls` Kubernetes
# Secret at /etc/nginx/certs/ (not baked into the image — a private key never
# belongs in an image layer). Both ports are exposed via NodePort (80->30080,
# 443->30443); no forced 80->443 redirect because the external NodePort numbers
# differ from the internal 80/443 and nginx cannot know them. Browsers will warn
# once about the self-signed cert; that is expected for a homelab staging cert.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # k8s readiness/liveness probe target (nginx itself, no backend needed).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # REST API -> backend Service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Django Channels) -> backend Service.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 65s;
    }

    # Django static (WhiteNoise) + user media -> backend Service.
    location /static/ { proxy_pass http://backend:8000; }
    location /media/  { proxy_pass http://backend:8000; }

    # Long-cache the hashed Angular assets.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA client-side routing: everything else returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
