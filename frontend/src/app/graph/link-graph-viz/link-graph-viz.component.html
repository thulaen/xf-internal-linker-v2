<div #wrapper class="viz-wrapper">
  @if (isSimulating()) {
    <div class="sim-overlay">
      <mat-spinner diameter="48"></mat-spinner>
      <p class="sim-label">Computing layout…</p>
    </div>
  }
  <div #chartHost class="force-graph"
       role="img"
       aria-label="Link network graph — pages as dots, links between them as lines"></div>
</div>
