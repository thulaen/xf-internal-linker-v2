global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics/
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
    headers:
      - "X-Metrics-Token: dev-metrics-token-change-me"

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: vmsingle
    static_configs:
      - targets: ["vmsingle:8428"]

  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]

  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
