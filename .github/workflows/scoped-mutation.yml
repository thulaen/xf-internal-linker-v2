name: Scoped Mutation (CI)

# Phase J: per-language scoped mutation testing on the server.
#
# Per the user policy (2026-05-18):
#   - GitHub PR CI runs scoped mutation only for changed modules.
#   - CI runs uncapped (no 5-min wall-clock cap; XF_QUALITY_ENV=ci).
#   - CI hard-blocks the PR on mutation-score thresholds (Stryker 95%,
#     mutmut 100%, cargo-mutants per config/mutation-routing.json).
#   - The backend is Python + Rust only (ADR 0007); the former C++ (Mull)
#     and Go (go-mutesting) scoped jobs were removed on 2026-06-06.
#
# Local commits use the same scripts with XF_QUALITY_ENV=local; that
# path is soft-block (surviving mutants become AutoIssues via
# file_mutation_survivors).
#
# Trigger matrix: both `push` (any branch) AND `pull_request` events
# per the user's choice.

on:
  push:
  pull_request:

env:
  XF_QUALITY_ENV: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  detect:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      angular: ${{ steps.classify.outputs.angular }}
      python: ${{ steps.classify.outputs.python }}
      rust: ${{ steps.classify.outputs.rust }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            # push event: diff against the immediate parent.
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify changed files
        id: classify
        run: |
          set -e
          payload="$(python scripts/detect_changed_modules.py --base ${{ steps.base.outputs.base }} --format json)"
          echo "$payload"
          echo "angular=$(echo "$payload" | jq -c '.angular')" >> "$GITHUB_OUTPUT"
          echo "python=$(echo "$payload" | jq -c '.python')" >> "$GITHUB_OUTPUT"
          # The rust bucket may be absent in older detect_changed_modules.py
          # output; default to [] so the rust-mutation job's `if:` guard
          # cleanly skips instead of erroring.
          echo "rust=$(echo "$payload" | jq -c '.rust // []')" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$payload" | jq -r '.any_mutation_targets')" >> "$GITHUB_OUTPUT"

  bazel-mutation:
    name: Bazel mutation (changed files)
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Bazel mutation target
        env:
          XF_QUALITY_ENV: ci
          XF_CHANGED_ANGULAR: ${{ needs.detect.outputs.angular }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          XF_CHANGED_PYTHON: ${{ needs.detect.outputs.python }}
          XF_CHANGED_RUST: ${{ needs.detect.outputs.rust }}
        run: python scripts/bazel_default.py run //tools/quality:mutation

  remote-only-evidence:
    name: Record CI completion evidence
    needs: [detect, bazel-mutation]
    if: always() && needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Summary
        run: |
          echo "Scoped mutation workflow finished."
          echo "Bazel mutation: ${{ needs.bazel-mutation.result }}"
