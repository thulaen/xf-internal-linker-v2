name: CI failure to AutoIssue

"on":
  workflow_run:
    workflows: ["CI", "Scoped Mutation (CI)"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  file-failures:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Enumerate failed jobs and file AutoIssues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_FAILED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python scripts/enumerate_failed_jobs.py \
            --run-id "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$RUN_WORKFLOW" > /tmp/ci-failure-args.jsonl
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          for line in Path("/tmp/ci-failure-args.jsonl").read_text().splitlines():
              if not line.strip():
                  continue
              args = json.loads(line)
              args.extend([
                  "--branch",
                  os.environ.get("RUN_BRANCH", ""),
                  "--commit-sha",
                  os.environ.get("RUN_SHA", ""),
                  "--commit-message-first-line",
                  os.environ.get("RUN_TITLE", ""),
                  "--failed-at",
                  os.environ.get("RUN_FAILED_AT", ""),
                  "--run-url",
                  os.environ.get("RUN_URL", ""),
              ])
              subprocess.run(
                  [
                      "docker",
                      "compose",
                      "exec",
                      "-T",
                      "backend",
                      "python",
                      "manage.py",
                      "file_ci_failure",
                      *args,
                  ],
                  check=True,
              )
          PY
