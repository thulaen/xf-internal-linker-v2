name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  docker-quality:
    name: Docker-managed hard-blocking quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tool-readiness
        run: bash scripts/run-tool-readiness.sh
      - name: Run Python quality checks
        run: bash scripts/run-python-quality.sh
      - name: Run Angular quality checks
        run: bash scripts/run-angular-quality.sh
      - name: Run C++ quality checks
        run: bash scripts/run-cpp-quality.sh
      - name: Run Go quality checks
        run: bash scripts/run-go-quality.sh

  quality-debt:
    name: Whole-repo quality debt report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record whole-repo coverage and mutation debt
        env:
          QUALITY_DEBT_RUN_FULL_MUTATION: "1"
        run: bash scripts/run-quality-debt-report.sh

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, go, cpp]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  infer-cpp:
    name: Infer C++ static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Infer on C++ extensions
        run: |
          docker compose run --rm compiled-tools bash -lc '
            cd /repo/backend/extensions
            cmake -B /tmp/xf-build/infer -S . \
              -DCMAKE_C_COMPILER=clang-19 \
              -DCMAKE_CXX_COMPILER=clang++-19 \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            infer run --fail-on-issue \
              --compilation-database /tmp/xf-build/infer/compile_commands.json
          '

  # ── 1. Django backend tests ──────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-fake-password
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Check Django migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          DJANGO_SECRET_KEY: ci-fake-secret-key
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests with coverage (ratchet floor enforced)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-fake-secret-key
        # Wrap Django's test runner in coverage.py so the floor in
        # pytest.ini's `--cov-fail-under=68` is actually enforced at
        # CI time. Without this wrapper, coverage was measured but
        # never gated. Floor is a ratchet — only goes up, never down.
        #
        # `--shuffle` randomizes test execution order on every run (Django
        # 4.0+ feature). Order-dependent tests will surface as non-zero
        # exit. The seed is printed in the output for repro. The local
        # pre-commit fast band uses pytest-randomly for the same purpose.
        run: |
          python -m coverage run --source=apps,config manage.py test --verbosity=2 --noinput --shuffle
          python -m coverage report --fail-under=68

  # ── 2. Angular build + unit tests ───────────────────────────────
  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build:prod

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:ci

  # ── 3. Python linting (ruff) ─────────────────────────────────────
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check backend/


  # ── 5. C++ static analysis ─────────────────────────────────────
  cpp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck
          --enable=warning,performance,portability
          --std=c++17
          --error-exitcode=1
          --suppress=missingIncludeSystem
          backend/extensions/*.cpp

  # ── 6. Angular linting (ESLint) ─────────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx ng lint

  # ── 6b. Stylelint for SCSS (BLOCKING — hardened 2026-05-10) ──────
  # Enforces the CLAUDE.md design rules: no hardcoded hex (use CSS
  # variables from default-theme.scss), no linear-gradient or radial-
  # gradient, no orange shades (#f6821f, #ee730a, #ff6600). The
  # default-theme.scss and styles.scss files are exempted via overrides
  # in frontend/.stylelintrc.json — those are the source of truth.
  #
  # Was non-blocking until 2026-05-10 because the codebase had ~180
  # legacy hardcoded-hex violations. Those were swept in the prevention
  # cleanup (Phase 2a) and the gate was flipped to blocking. See
  # docs/CI-GATES.md for the inventory and PLAIN-ENGLISH-RULE.md for
  # what each rule means.
  frontend-lint-scss:
    name: Stylelint (SCSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Stylelint (SCSS) — fails on any violation
        working-directory: frontend
        run: npm run lint:scss

  # ── 7. Python type checking (mypy) ──────────────────────────────
  backend-typecheck:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-fake-password
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run mypy
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-fake-secret-key
        run: python -m mypy apps/crawler/ --config-file mypy.ini

  # ── 8. Python security scanning (bandit) ──────────────────────
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        working-directory: backend
        run: bandit -r apps/ -c bandit.yml

  # ── 9. Python dependency vulnerability scan ───────────────────
  python-deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

  # ── 10. Frontend dependency vulnerability scan ─────────────────
  frontend-deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  # ── 11. Validate docker-compose.yml ────────────────────────────
  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare compose env file
        run: cp .env.example .env

      - name: Validate docker-compose.yml syntax
        run: docker compose config

  # ── 12. Semgrep security scan (BLOCKING on ERROR-only — hardened 2026-05-10) ─
  # The scan fails CI on findings whose
  # severity is ERROR; WARNING/INFO ride through and upload as artifacts
  # for triage. See docs/CI-GATES.md.
  semgrep:
    name: Semgrep Security Scan (ERROR-only)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep (Django + Python rules)
        run: >
          semgrep
          --config=p/django
          --config=p/python
          --config=p/secrets
          --severity=ERROR
          --error
          --output=semgrep-results.json
          --json
          backend/
      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # ── 13. Trivy container vulnerability scan (BLOCKING on fixable HIGH/CRITICAL — hardened 2026-05-10) ─
  # Was `exit-code: '0'` (always-pass). Now fails CI when a fixable
  # CRITICAL or HIGH CVE is detected; unfixed CVEs ride through via
  # `ignore-unfixed: true` so we don't permanently fail on third-party
  # vulns the upstream hasn't shipped a patch for. See docs/CI-GATES.md.
  trivy-scan:
    name: Trivy Dependency Scan (fixable HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
          output: trivy-results.txt
      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-results
          path: trivy-results.txt
          retention-days: 30

  # ── 14. clang-format style check (blocking) ───────────────────────
  # Pin to clang-format-22 (matches the local Windows install at
  # C:\Program Files\LLVM\bin\clang-format.exe, version 22.1.x).
  # Without a version pin, apt-get installs whatever Ubuntu currently
  # ships, and different majors produce different output for the same
  # .clang-format config — so a clean source can fail today even though
  # it passed yesterday. We install from apt.llvm.org because Ubuntu's
  # default repos only ship clang-format-18.
  # If the pinned major version is bumped, also re-run the new
  # clang-format -i over backend/extensions/ locally and commit the diff
  # — the workflow gate validates source against the pinned binary.
  cpp-format:
    name: C++ Format Check (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format-22 (from apt.llvm.org)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22
      - name: Check C++ formatting
        run: |
          find backend/extensions \( -name "*.cpp" -o -name "*.h" \) | \
            grep -v '/build/' | \
            xargs clang-format-22 --dry-run --Werror --style=file

  # ── 15. Playwright E2E tests (CI-safe subset, blocking — live/ excluded) ──
  # The `PLAYWRIGHT_CI=1` env var tells playwright.config.ts to apply
  # `testIgnore: ['**/live/**']`. The `live/` specs need a fully-booted
  # backend stack with seeded data (database, Celery, etc.) which this
  # workflow does not provide. New top-level smoke specs added under
  # `frontend/tests/` are auto-included; new specs under `frontend/tests/live/`
  # are auto-excluded from CI without further workflow edits.
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        working-directory: frontend
        run: npm run build:prod
      - name: Run Playwright tests (CI-safe subset, blocking)
        working-directory: frontend
        env:
          PLAYWRIGHT_CI: "1"
        run: npx playwright test --reporter=html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── 16. C++ edge-case unit tests (blocking) ───────────────────────────────
  cpp-edge-tests:
    name: C++ Edge-Case Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Docker-managed edge-case tests
        run: docker compose run --rm compiled-tools bash /repo/scripts/run-cpp-edge-tests.sh --clean

  # ── 17. GoogleTest C++ unit tests (blocking) ─────────────────────
  cpp-test:
    name: C++ Unit Tests (GoogleTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Docker-managed C++ unit tests
        run: docker compose run --rm compiled-tools bash /repo/scripts/run-cpp-tests.sh --clean

  # ── 17b. Clang-Tidy semantic gate (blocking) ─────────────────────
  # Phase 3 of the test-hardening plan. Fails the build on the
  # WarningsAsErrors subset declared in .clang-tidy (bugprone-*, cert-*,
  # performance-unnecessary-copy-initialization, accidental moves, etc.).
  # The full Checks list runs in the Docker-managed quality job while each
  # rule family is cleaned up — see backend/ruff.toml for the analogous
  # ratchet pattern on the Python side.
  cpp-clang-tidy:
    name: C++ Clang-Tidy (semantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libtbb-dev clang-tidy
      - name: Configure (emit compile_commands.json)
        working-directory: backend/extensions
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build (so headers are generated where applicable)
        working-directory: backend/extensions
        run: cmake --build build --parallel 2
      - name: Run clang-tidy on project sources
        working-directory: backend/extensions
        # `-p build` reads compile_commands.json. We deliberately limit
        # to the top-level .cpp files (the C++ "hot path" modules) so
        # GoogleTest / pybind11 internals don't bloat the report.
        run: |
          mapfile -t SRCS < <(find . -maxdepth 1 -name "*.cpp")
          if [ "${#SRCS[@]}" -eq 0 ]; then echo "no C++ sources found"; exit 1; fi
          clang-tidy --quiet -p build "${SRCS[@]}"

  # ── 17c. Python mutation testing (mutmut, blocking) ──────────────
  # Phase 4a — scoped initially to apps/auto_issues/services/
  # fingerprinting.py. Surviving mutants fail the build. Scope expands
  # one module per PR via the AutoIssue ratchet (see #162).
  python-mutmut:
    name: Python Mutation (mutmut)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run mutmut on scoped module
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-fake-secret-key
        run: |
          mkdir -p reports
          mutmut run \
            --paths-to-mutate=apps/auto_issues/services/fingerprinting.py \
            --runner="python -m pytest apps/auto_issues -p randomly -x -q --no-cov" \
            --processes=2
          mutmut results
          # Fail the job if ANY mutant survived.
          mutmut junitxml > reports/mutmut-fingerprinting.xml
          grep -q 'failures="0"' reports/mutmut-fingerprinting.xml || (
            echo "FAIL: surviving mutants found — see report above";
            cat reports/mutmut-fingerprinting.xml;
            exit 1
          )
      - name: Run mutmut on FR-011 scorer
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-fake-secret-key
        run: |
          rm -rf .mutmut-cache
          mutmut run \
            --paths-to-mutate=apps/pipeline/services/field_aware_relevance.py \
            --runner="python -m pytest apps/pipeline/tests.py::FieldAwareRelevanceServiceTests -p randomly -x -q --no-cov" \
            --processes=2
          mutmut results
          mutmut junitxml > reports/mutmut-field-aware-relevance.xml
          grep -q 'failures="0"' reports/mutmut-field-aware-relevance.xml || (
            echo "FAIL: surviving Python mutants found in field_aware_relevance.py";
            cat reports/mutmut-field-aware-relevance.xml;
            exit 1
          )
      - name: Mutation-score ratchet (FR-251 Gap #4)
        if: always()
        run: |
          test -f backend/reports/mutmut-fingerprinting.xml
          test -f backend/reports/mutmut-field-aware-relevance.xml
          grep -q 'failures="0"' backend/reports/mutmut-fingerprinting.xml
          grep -q 'failures="0"' backend/reports/mutmut-field-aware-relevance.xml
      - name: Upload mutmut report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutmut-results
          path: backend/reports/mutmut-*.xml
          retention-days: 30

  # ── 17d. Angular mutation testing (Stryker, blocking) ────────────
  # Phase 4a — scoped initially to one core service. Surviving mutants
  # below thresholds.break (95%) fail the build.
  frontend-stryker:
    name: Angular Mutation (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run Stryker
        working-directory: frontend
        run: npx stryker run
      - name: Mutation-score ratchet (FR-251 Gap #4)
        if: always()
        run: |
          test -f frontend/reports/stryker.json
          python .githooks/check-mutation-score.py \
            --tool stryker \
            --target src/app \
            --report frontend/reports/stryker.json
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stryker-report
          path: frontend/reports/
          retention-days: 30

  cpp-mull:
    name: C++ Mutation (Mull, all 7 GTest binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Docker-managed Mull across all 7 GTest binaries
        run: docker compose run --rm compiled-tools bash /repo/scripts/run-cpp-mutation.sh --clean
      - name: Mutation-score ratchet for each C++ binary
        if: always()
        run: |
          set -e
          failed=0
          for target in test_fieldrel test_scoring test_passagesim test_simsearch test_quantemb test_ivf_index test_streaming_sketches test_papertrail_dedup test_lesson_index; do
            report="backend/extensions/reports/mull/${target}/mutants.json"
            if [ -f "$report" ]; then
              python .githooks/check-mutation-score.py \
                --tool mull \
                --target "$target" \
                --report "$report" \
                --seed-if-empty || failed=1
            else
              echo "FAIL: Mull report is absent for $target ($report)"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload Mull report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mull-report
          path: backend/extensions/reports/mull/
          retention-days: 30

  go-quality:
    name: Go Tests, Coverage, and Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Docker-managed Go quality chain (slice 1.5 stage-by-stage)
        run: bash scripts/run-go-quality.sh

  # ── 17e+. libFuzzer smoke (blocking, 60s per target) ─────────────
  # Phase 4b — runs each starter fuzz target for 60 s under
  # `-fsanitize=fuzzer,address,undefined`. Any crash / leak / UB
  # report fails the job. Nightly build extends each to 30 min.
  cpp-libfuzzer-smoke:
    name: C++ libFuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build compiled-tools image
        run: docker compose build compiled-tools
      - name: Run Docker-managed libFuzzer smoke
        run: docker compose run --rm compiled-tools bash /repo/scripts/run-cpp-fuzz-smoke.sh --clean
      - name: Upload any crash reproducers
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: libfuzzer-crashes
          path: |
            backend/extensions/fuzz/crash-*
            backend/extensions/fuzz/oom-*
            backend/extensions/fuzz/leak-*
            backend/extensions/fuzz/timeout-*
          retention-days: 30
          if-no-files-found: ignore

  # ── 18. AddressSanitizer (blocking) ──────────────────────────────
  cpp-asan:
    name: C++ AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libtbb-dev
      - name: Configure with ASAN
        working-directory: backend/extensions
        run: |
          cmake -B build_asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        working-directory: backend/extensions
        run: cmake --build build_asan --parallel
      - name: Test
        working-directory: backend/extensions/build_asan
        # --schedule-random + GTEST_SHUFFLE (from CMakeLists.txt) catch
        # order-dependent ASan failures. -j 2 caps parallel exec.
        run: ctest --output-on-failure --schedule-random -j 2

  # ── 18b. MemorySanitizer (blocking, project-only) ────────────────
  # Phase 4c — catches reads of uninitialised memory. Limited to our
  # own C++ files via -fsanitize-blacklist=msan-ignore.txt so we don't
  # have to recompile Faiss / Eigen / ICU / TBB with MSan (which would
  # take 2-3 days and produce a fragile toolchain). Runs only on the
  # tests that don't transitively call those libraries.
  cpp-msan:
    name: C++ MemorySanitizer (project-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Clang + dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libtbb-dev clang
          pip install pybind11
      - name: Configure with MSan + blacklist
        working-directory: backend/extensions
        run: |
          cmake -B build_msan \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-blacklist=$(pwd)/msan-ignore.txt -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory"
      - name: Build the three project-only test binaries
        # Skip test_quantemb / test_ivf_index / test_streaming_sketches
        # (Faiss / Eigen heavy paths that the blacklist suppresses but
        # whose uninstrumented internals would still trip MSan).
        working-directory: backend/extensions
        run: cmake --build build_msan --parallel 2 --target test_simsearch test_scoring test_passagesim
      - name: Run MSan-instrumented tests
        working-directory: backend/extensions/build_msan
        env:
          MSAN_OPTIONS: "abort_on_error=1:print_stats=1:halt_on_error=1"
        # Scheduled-random for inter-test order; GTEST_SHUFFLE for intra.
        run: |
          ctest --output-on-failure --schedule-random -j 2 \
            -R '^(test_simsearch|test_scoring|test_passagesim)\.'

  # ── 19. ThreadSanitizer (blocking) ───────────────────────────────
  # GATE-DOWNGRADE-JUSTIFICATION: TBB false-positive noise; suppression
  # file requires Linux TSAN run before flipping blocking. Plan-to-flip
  # documented in docs/CI-GATES.md under "Advisory Gate Justifications".
  cpp-tsan:
    name: C++ ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libtbb-dev
      - name: Configure with TSAN
        working-directory: backend/extensions
        run: |
          cmake -B build_tsan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        working-directory: backend/extensions
        run: cmake --build build_tsan --parallel
      - name: Test
        working-directory: backend/extensions/build_tsan
        # --schedule-random + GTEST_SHUFFLE (from CMakeLists.txt) help
        # surface order-dependent TSan races. -j 2 caps parallel exec.
        run: ctest --output-on-failure --schedule-random -j 2

  # ── 17f. C++ coverage report (blocking) ──────────────────────────
  cpp-coverage:
    name: C++ coverage (lcov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build + coverage tooling
        run: sudo apt-get update && sudo apt-get install -y cmake libtbb-dev lcov
      - name: Configure with COVERAGE=ON
        working-directory: backend/extensions
        run: cmake -B build_cov -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON
      - name: Build
        working-directory: backend/extensions
        run: cmake --build build_cov --parallel 2
      - name: Run tests under coverage
        working-directory: backend/extensions/build_cov
        run: ctest --output-on-failure --schedule-random -j 2
      - name: Generate lcov report
        working-directory: backend/extensions
        run: |
          lcov --capture --directory build_cov --output-file build_cov/coverage.info
          lcov --remove build_cov/coverage.info '*/_deps/*' '*/tests/*' '*/build_cov/*' \
            --output-file build_cov/coverage.filtered.info
          lcov --list build_cov/coverage.filtered.info > build_cov/coverage.txt
          cat build_cov/coverage.txt
          lcov --summary build_cov/coverage.filtered.info | tee build_cov/coverage-summary.txt
          grep -q "branches.*100.0%" build_cov/coverage-summary.txt
      - name: Upload C++ coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cpp-coverage
          path: |
            backend/extensions/build_cov/coverage.filtered.info
            backend/extensions/build_cov/coverage.txt
          retention-days: 30

  # ── 19a. Per-PR coverage-delta (BLOCKING — FR-251 Gap #2) ────────
  # Reuses `.githooks/check-per-module-coverage.py` against the PR base
  # so the per-module ratchet is enforced in CI as well as pre-push.
  # On main-branch pushes the check is a no-op (no diff against itself).
  coverage-delta-check:
    name: Per-module coverage ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need history to diff against base
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend deps + coverage
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run per-module ratchet against PR base
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-fake-secret-key
        run: |
          python .githooks/check-per-module-coverage.py \
            --against="origin/${{ github.event.pull_request.base.ref }}"

  # ── 19b. Super-Linter (BLOCKING, covers the gaps) ────────────────
  # Phase 5 — Super-Linter pins ~50 linters; we only enable the ones
  # we don't already run as dedicated jobs (Hadolint, GitHub Actions,
  # Markdown, Bash, YAML, JSON, Gitleaks). Ruff / ESLint / Stylelint
  # are disabled in .github/super-linter.env so we don't run them
  # twice with potentially-conflicting versions.
  super-linter:
    name: Super-Linter (gaps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Super-Linter needs full git history to know what's "changed".
          fetch-depth: 0
      - name: Lint Code Base
        uses: super-linter/super-linter@v7
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read the rest of the env from .github/super-linter.env so
          # the config lives in version control and stays in sync with
          # the Phase 6 lint-error AutoIssue picker.
          ENV_FILE: .github/super-linter.env
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: super-linter-results
          path: super-linter.log
          retention-days: 30

  # ── 20. Missing-tests check (BLOCKING — hardened 2026-05-10) ─────
  # When a PR adds a new backend service module under
  # backend/apps/*/services/ or a new Angular *.component.ts / *.service.ts,
  # check whether a matching test file landed in the same PR. If not, fail.
  # The local pre-commit hook (.githooks/check-missing-tests.py) catches
  # the same thing earlier; this CI gate is the safety net for force-pushed
  # branches and PRs from contributors without the local hook installed.
  missing-tests-check:
    name: Missing Tests (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect new modules without tests
        shell: bash
        run: |
          set -e
          BASE=$(git merge-base origin/master HEAD)
          NEW_PY=$(git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -E '^backend/apps/[^/]+/services/[^/]+\.py$' | grep -v __init__ || true)
          NEW_TS=$(git diff --name-only --diff-filter=A "$BASE"...HEAD | grep -E '^frontend/src/.*\.(component|service)\.ts$' | grep -v '\.spec\.ts$' || true)

          MISSING=""

          for f in $NEW_PY; do
            dir=$(dirname "$f")
            base=$(basename "$f" .py)
            # Accept any of three test-file locations:
            #   1. same dir: <dir>/test_<base>.py
            #   2. parent app dir: <dir>/../test_<base>.py
            #   3. dedicated tests dir: <dir>/../tests/test_<base>.py
            CANDIDATES="${dir}/test_${base}.py ${dir}/../test_${base}.py ${dir}/../tests/test_${base}.py"
            FOUND=""
            for c in $CANDIDATES; do
              if git ls-files "$c" 2>/dev/null | grep -q .; then
                FOUND="yes"
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              MISSING="${MISSING}%0A  ${f}"
            fi
          done

          for f in $NEW_TS; do
            spec="${f%.ts}.spec.ts"
            if ! git ls-files "$spec" 2>/dev/null | grep -q .; then
              MISSING="${MISSING}%0A  ${f}"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::New modules added without matching test files:${MISSING}"
            echo "::error::See docs/TESTING.md for naming conventions and where new tests go."
            exit 1
          else
            echo "All new modules have matching test files."
          fi
