name: "CodeQL resource-conscious config"

paths-ignore:
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/coverage-html/**"
  - "**/.pytest_cache/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/__pycache__/**"
  - "**/target/**"
  - "**/tmp/**"
  - "**/reports/**"
  - "**/audit/**"
  - "backend/apps/**/migrations/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
  - "postgres/**"
  - "**/*.sql"
