sonar.projectKey=xf-internal-linker-v2
sonar.projectName=XF Internal Linker V2
sonar.sourceEncoding=UTF-8
# Both scanner paths (scripts/dell-sonar-autoscan.sh and the manual sonar-scanner
# compose service) stage only backend/ and frontend/ into /tmp/sonar-src, so
# sonar.sources must stay within those trees. Listing scripts/.githooks/services
# here made every scan abort with "The folder 'scripts' does not exist".
sonar.sources=backend/apps,backend/config,frontend/src
sonar.python.version=3.12
sonar.working.directory=/tmp/sonar-work

sonar.exclusions=**/.git/**,**/__pycache__/**,**/.pytest_cache/**,**/node_modules/**,**/dist/**,**/coverage/**,**/coverage-html/**,**/.scannerwork/**,**/reports/**,**/test_*.py,**/tests_*.py,**/tests.py,**/*.spec.ts,**/*_test.go,**/*_test.cpp,**/test*.cpp,backend/apps/_sidecars_pb/**,services/**/api/gen/**,**/*_pb2.py,**/*_pb2_grpc.py,**/*.pb.go
sonar.coverage.exclusions=**/migrations/**,**/tests/**,**/test_*.py,**/tests_*.py,**/*.spec.ts,**/*_test.go,**/*_test.cpp,**/test*.cpp,backend/apps/_sidecars_pb/**,services/**/api/gen/**

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Django settings modules use the canonical "from .base import *" re-export
# pattern. SonarSource's python:S2208 rule documents an exception when the
# imported module declares __all__ (see https://rules.sonarsource.com/python/RSPEC-2208 -
# "This rule will not raise an issue if the imported module declares an __all__
# attribute, as it is a way to declare a public API."). base.py declares
# __all__, but the analyser does NOT honour that exception in practice.
# The wildcard import is the canonical Django settings pattern per
# https://docs.djangoproject.com/en/stable/topics/settings/, so we
# declaratively exclude python:S2208 from the four settings files.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2208
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/config/settings/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2208
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/config/settings/ci.py
