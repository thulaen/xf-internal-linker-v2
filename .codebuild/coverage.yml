version: 0.2

phases:
  build:
    commands:
      - . scripts/quality_cores.sh
      - workers="$(quality_cores lua-coverage)"
      - mkdir -p reports/lua
      - busted --coverage --jobs "$workers" apps/ frontend/nginx-lua/ .githooks/lua/
      - luacov-cobertura -o reports/lua/coverage.xml
artifacts:
  files:
    - reports/lua/coverage.xml
    - luacov.report.out
