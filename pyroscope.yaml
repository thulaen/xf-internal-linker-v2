# Pyroscope OSS — minimal single-host config.
# See docker-compose.yml `pyroscope` service for how this is mounted.
# Hot-functions surfaced from this server feed the `auto_issues` table
# via the C++ daily-picker (spec: docs/CPP-DAILY-ISSUE-PICKER-SPEC.md).

# Server listens on 4040; Docker forwards to host 127.0.0.1:4040.
server:
  http_listen_port: 4040
  log_level: info

# All-in-one mode: ingester + querier + compactor on a single node. Fine
# for single-host dev/local deployments with low profile volume (<1 GB).
target: all

# Local filesystem storage. Pyroscope rotates profiles automatically;
# 30-day retention keeps the volume bounded.
storage:
  backend: filesystem
  filesystem:
    dir: /data

# Profile retention. Pyroscope now runs on the Mint helper (mint-quality
# profile), where the old Windows-side Celery file-cleanup
# (apps.auto_issues.services.retention_cleanup) no longer reaches the data.
# So retention is enforced by Pyroscope itself: the compactor drops blocks
# older than 30 days, which keeps Mint's /data volume bounded without any
# external job. (Takes effect after Mint pulls this config and restarts the
# pyroscope container.)
limits:
  compactor_blocks_retention_period: 30d
  max_query_lookback: 30d
  max_query_length: 7d
