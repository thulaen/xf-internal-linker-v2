listen_addresses = '*'
port = 5432
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
max_connections = 500
max_parallel_workers_per_gather = 2
wal_compression = on
statement_timeout = '300s'

# pg_stat_statements — required for the slow-query auto-issue picker.
# Tracks the top 5000 most-executed normalised statements + total time.
# Must be loaded before the database starts (shared_preload_libraries).
# Negligible overhead (~1-3% per query). Adds ~3 MB shared memory.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = 'all'
pg_stat_statements.track_utility = on
