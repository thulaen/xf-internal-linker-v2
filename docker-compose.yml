# ═══════════════════════════════════════════════════════════════════
# XF Internal Linker V2 — Single prod-only compose stack
#
# HOW TO USE:
#   docker compose --env-file .env up --build
#
# WHY NO DEV MODE:
#   Local development runs against the same prod Angular bundle +
#   production Django settings as a live deployment, so any measurement
#   or screenshot taken while working matches what operators actually
#   see. See `docs/PERFORMANCE.md §12` for the rationale.
#
# OPTIONAL PROFILES:
#   docker compose --profile debug up    → adds GlitchTip error tracking
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────
  # PostgreSQL 17 with pgvector extension
  # All application data + embeddings live here
  # ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: xf_linker_postgres
    restart: always
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xf_linker}
      POSTGRES_USER: ${POSTGRES_USER:-xf_linker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xf_linker_user} -d ${POSTGRES_DB:-xf_linker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7 — cache + Celery broker + WebSocket
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: xf_linker_redis
    restart: always
    mem_limit: 640m
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Django 5.2 LTS backend — production settings + Daphne/uvicorn ASGI
  # No --reload (per-request overhead), 4 workers.
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: xf-linker-backend:latest
    container_name: xf_linker_backend
    restart: always
    mem_limit: 2560m
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      # The nginx sidecar terminates HTTP on :80. For a local prod run
      # we are NOT behind HTTPS, so relax the HTTPS-only defaults from
      # production.py. A real HTTPS deployment should remove these
      # overrides (or set them to True/longer HSTS) via .env.
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-False}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-False}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-False}"
      # 2026-05-09: bumped default 0 → 31536000 (1 year) so Django's
      # `check --deploy` no longer raises security.W004. The original `0`
      # default was set when nginx terminated plain HTTP; the stack now
      # serves via HTTPS so HSTS is appropriate. To override for a one-off
      # local-HTTP test, set `DJANGO_SECURE_HSTS_SECONDS=0` in `.env`.
      DJANGO_SECURE_HSTS_SECONDS: "${DJANGO_SECURE_HSTS_SECONDS:-31536000}"
      HOME: /tmp
      PYTHONPATH: /opt/xf/compiled/active:/opt/xf/compiled:/app
      XF_COMPILED_ARTIFACT_ROOT: /opt/xf/compiled
      XF_COMPILED_BUILD_ROOT: /tmp/xf-build
      RUNTIME_PROGRESS_STREAM_PREFIX: runtime:progress
      REPO_ROOT: /repo
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      PYROSCOPE_APPLICATION_NAME: xf-linker-backend
    volumes:
      - ./backend:/app
      - .:/repo
      - compiled_artifacts:/opt/xf/compiled
      - media_files:/app/media
      - staticfiles:/app/staticfiles
      # Slice 1.5 — streamd Unix-domain socket. Read-write so the private
      # Python client (apps/realtime/_streamd_client.py) can dial it.
      - streamd_sock:/var/run/xf:rw
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health/"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runtime command — kept lean on purpose. `pip install -r
    # requirements.txt` and the drf_spectacular import probe used to live
    # here, but the Dockerfile already does both at build time
    # (backend/Dockerfile:62-63), so re-running them at every container
    # start was dead weight. Worse, on a freshly-booted laptop the
    # network may not yet be up — `pip install` would fail, the
    # container would exit, `restart: always` would loop forever, and
    # Docker Desktop's startup spinner would never settle. Removed
    # 2026-04-26. The build_ext step stays because the bind mount of
    # ./backend → /app hides the image-baked .so files, so they must
    # live in the host directory too; setuptools mtime-checks make this
    # a near-instant no-op when sources are unchanged.
    command: >
      sh -c "python /repo/scripts/ensure_compiled_artifacts.py &&
             until python manage.py migrate --noinput; do
               echo 'Postgres is not ready yet. Waiting 5 seconds...';
               sleep 5;
             done &&
             python manage.py collectstatic --noinput &&
             python -m uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 4"

  # ─────────────────────────────────────────────
  # Celery worker - default queue only
  # Handles: light background jobs that are safe to parallelise
  # ─────────────────────────────────────────────
  celery-worker-default:
    image: xf-linker-backend:latest
    container_name: xf_linker_celery_worker_default
    restart: always
    mem_limit: 1536m
    user: "0:0"
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      HOME: /tmp
      PYTHONPATH: /opt/xf/compiled/active:/opt/xf/compiled:/app
      XF_COMPILED_ARTIFACT_ROOT: /opt/xf/compiled
      XF_COMPILED_BUILD_ROOT: /tmp/xf-build
      RUNTIME_PROGRESS_STREAM_PREFIX: runtime:progress
      REPO_ROOT: /repo
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      PYROSCOPE_APPLICATION_NAME: xf-linker-celery-default
    volumes:
      - ./backend:/app
      - .:/repo:ro
      - compiled_artifacts:/opt/xf/compiled
      - hf_cache:/tmp/.cache
      # 90-day Pyroscope retention cleanup (auto_issues.run_retention_cleanup)
      # walks this volume and deletes blocks older than 90 days.
      - pyroscope_data:/pyroscope-data
    healthcheck:
      # Healthcheck rewrite (ISS-101 durable fix 2026-05-09): the old
      # `inspect ping -d celery@$HOSTNAME` depends on the worker's
      # control channel (kombu pidbox subscription on Redis), which
      # silently dies after ~9h of uptime even while the worker keeps
      # processing tasks. Now check (1) the worker process is alive, AND
      # (2) the broker is reachable. If those two hold, the worker can
      # take work — control channel is decorative for liveness.
      test: ["CMD-SHELL", "ps -ef | grep -q '[c]elery -A config.celery worker' && python -c 'from kombu import Connection; Connection(\"redis://redis:6379/0\").ensure_connection(timeout=3)' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /tmp/.cache/huggingface &&
             chown -R appuser:appuser /tmp/.cache &&
             su -m appuser -c 'python /repo/scripts/ensure_compiled_artifacts.py &&
             python -c \"import drf_spectacular\" &&
             DEFAULT_QUEUE_CONCURRENCY=$$(python manage.py print_default_queue_concurrency) &&
             celery -A config.celery worker --loglevel=warning --concurrency=$${DEFAULT_QUEUE_CONCURRENCY:-2} --prefetch-multiplier 1 --max-tasks-per-child=1000 -Q default'"

  # Celery worker - pipeline + embeddings queues only
  # Handles: heavy serial work that must stay single-process for FAISS correctness
  celery-worker-pipeline:
    image: xf-linker-backend:latest
    container_name: xf_linker_celery_worker_pipeline
    restart: always
    mem_limit: 2g
    user: "0:0"
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      HOME: /tmp
      PYTHONPATH: /opt/xf/compiled/active:/opt/xf/compiled:/app
      XF_COMPILED_ARTIFACT_ROOT: /opt/xf/compiled
      XF_COMPILED_BUILD_ROOT: /tmp/xf-build
      RUNTIME_PROGRESS_STREAM_PREFIX: runtime:progress
      REPO_ROOT: /repo
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      PYROSCOPE_APPLICATION_NAME: xf-linker-celery-pipeline
      CELERY_WORKER_CONCURRENCY: 1
    volumes:
      - ./backend:/app
      - .:/repo:ro
      - compiled_artifacts:/opt/xf/compiled
      - hf_cache:/tmp/.cache
      # 90-day Pyroscope retention cleanup (auto_issues.run_retention_cleanup)
      # walks this volume and deletes blocks older than 90 days.
      - pyroscope_data:/pyroscope-data
    healthcheck:
      # Healthcheck rewrite (ISS-101 durable fix 2026-05-09): the old
      # `inspect ping -d celery@$HOSTNAME` depends on the worker's
      # control channel (kombu pidbox subscription on Redis), which
      # silently dies after ~9h of uptime even while the worker keeps
      # processing tasks. Now check (1) the worker process is alive, AND
      # (2) the broker is reachable. If those two hold, the worker can
      # take work — control channel is decorative for liveness.
      test: ["CMD-SHELL", "ps -ef | grep -q '[c]elery -A config.celery worker' && python -c 'from kombu import Connection; Connection(\"redis://redis:6379/0\").ensure_connection(timeout=3)' || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /tmp/.cache/huggingface &&
             chown -R appuser:appuser /tmp/.cache &&
             su -m appuser -c 'python /repo/scripts/ensure_compiled_artifacts.py &&
             python -c \"import drf_spectacular\" &&
             celery -A config.celery worker --loglevel=warning --pool=solo --concurrency=1 --prefetch-multiplier 1 -Q pipeline,embeddings'"

  # ─────────────────────────────────────────────
  # Celery Beat — scheduled tasks (auto-resync, etc.)
  # ─────────────────────────────────────────────
  celery-beat:
    image: xf-linker-backend:latest
    container_name: xf_linker_celery_beat
    restart: always
    mem_limit: 256m
    user: "0:0"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      HOME: /tmp
      PYTHONPATH: /opt/xf/compiled/active:/opt/xf/compiled:/app
      XF_COMPILED_ARTIFACT_ROOT: /opt/xf/compiled
      XF_COMPILED_BUILD_ROOT: /tmp/xf-build
      RUNTIME_PROGRESS_STREAM_PREFIX: runtime:progress
      REPO_ROOT: /repo
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      PYROSCOPE_APPLICATION_NAME: xf-linker-celery-beat
    volumes:
      - ./backend:/app
      - .:/repo:ro
      - compiled_artifacts:/opt/xf/compiled
      - hf_cache:/tmp/.cache
    healthcheck:
      test: ["CMD-SHELL", "grep -q beat /proc/1/cmdline || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /tmp/.cache/huggingface &&
             chown -R appuser:appuser /tmp/.cache &&
             su -m appuser -c 'python /repo/scripts/ensure_compiled_artifacts.py &&
             celery -A config.celery beat --loglevel=warning --scheduler django_celery_beat.schedulers:DatabaseScheduler'"

  # ─────────────────────────────────────────────
  # Angular prod bundle build — runs once, publishes to volume, exits
  # Multi-stage Dockerfile compiles with `ng build --configuration=production`
  # and copies the output to /dist (the shared `frontend_dist` volume).
  # Nginx depends on this via service_completed_successfully.
  # ─────────────────────────────────────────────
  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: xf-linker-frontend-prod:latest
    container_name: xf_linker_frontend_build
    restart: "no"
    mem_limit: 2g
    volumes:
      - frontend_dist:/dist

  frontend-mutation-tools:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      target: build
    image: xf-linker-frontend-mutation-tools:latest
    container_name: xf_linker_frontend_mutation_tools
    restart: unless-stopped
    mem_limit: 1g
    working_dir: /app
    volumes:
      - .:/repo
      - frontend_tool_cache:/root/.npm
    command: sh -lc "tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "node --version >/dev/null 2>&1 && npm --version >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 20s

  compiled-tools:
    build:
      context: .
      dockerfile: tools/mutation/Dockerfile
    image: xf-linker-compiled-tools:latest
    container_name: xf_linker_compiled_tools
    restart: unless-stopped
    mem_limit: 2g
    working_dir: /repo
    volumes:
      - .:/repo
      - compiled_artifacts:/opt/xf/compiled
      - compiled_tool_cache:/root/.cache
      - go_tool_mod_cache:/go/pkg/mod
    command: bash -lc "tail -f /dev/null"
    healthcheck:
      test: ["CMD-SHELL", "command -v mutmut >/dev/null 2>&1 && command -v mull-runner-19 >/dev/null 2>&1 && command -v go >/dev/null 2>&1 && command -v cmake >/dev/null 2>&1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # Streamd — Go stream-engine broker sidecar (slice 1.5).
  # Publishes 4 gRPC RPCs (Publish / Subscribe / Manage / Health) over the
  # streamd_sock Unix-domain socket. Python callers route through the private
  # client at backend/apps/realtime/_streamd_client.py — never via direct
  # import. ADR 0006 + docs/MODULAR-MONOLITH.md § Services tier own the rules.
  # ─────────────────────────────────────────────
  streamd:
    build:
      context: ./services/streamd
    image: xf-linker-streamd:latest
    container_name: xf_linker_streamd
    restart: always
    # Slice 1.5 — scratch-based image with only two static binaries inside;
    # running as root is acceptable because there is no shell, package
    # manager, or writeable filesystem to compromise. read_only would block
    # the Unix-socket bind on /var/run/xf so it's off. user: 1000:1000 was
    # tried but Docker named volumes are root-owned by default which made
    # the socket bind fail with EACCES.
    volumes:
      - streamd_sock:/var/run/xf
    environment:
      XF_STREAMD_SOCKET: /var/run/xf/streamd.sock
      XF_STREAMD_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/streamd-healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3

  # ─────────────────────────────────────────────
  # Nginx — serves the Angular prod bundle + proxies /api/ and /ws/
  # Long-cache headers on hashed assets via nginx.prod.conf.
  # ─────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: xf_linker_nginx
    restart: always
    mem_limit: 128m
    # Cap the JSON-file logging driver so a chatty access log can't
    # silently fill the Windows VHDX. Three rotated files at 10 MB each
    # = 30 MB ceiling per service. See docs/PERFORMANCE.md.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # TLS certificate + private key — read-only inside the container.
      # Generated on the developer's machine by mkcert (see docs/DEV-HTTPS.md).
      - ./nginx/certs:/etc/nginx/certs:ro
      # Static maintenance page served on 502/503 before Angular boots.
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      # `frontend_dist` mounted RW (not `:ro`) because the child volumes
      # below sit on subdirectories inside this tree, and Docker cannot
      # create a mountpoint inside a read-only parent. Nginx runs as an
      # unprivileged user with no write permission on the files anyway.
      - frontend_dist:/usr/share/nginx/html
      # Shared volume for the OTel collector to tail the access log.
      # Nginx writes here; collector reads. See `filelog/nginx` receiver
      # in `otelcol-config.yaml`.
      - nginx_logs:/var/log/nginx-shared
      - staticfiles:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q ok || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────
  # GlitchTip — self-hosted error tracking (default-on, see CLAUDE.md
  # ABSOLUTE rule "Never disable or remove GlitchTip services"). Sentry-
  # compatible. Reuses existing postgres + redis. Dashboard at
  # http://localhost:1337.
  # ─────────────────────────────────────────────
  glitchtip-init:
    # One-shot job that ensures the `glitchtip` Postgres database exists
    # before the dashboard tries to migrate. Idempotent: skips if the DB
    # already exists. Without this service, a manual DROP DATABASE or a
    # postgres volume reset leaves the dashboard silently broken because
    # nothing else creates the DB on boot.
    image: pgvector/pgvector:pg17
    container_name: xf_linker_glitchtip_init
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-xf_linker_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: postgres
    command: >
      sh -c "psql -tAc \"SELECT 1 FROM pg_database WHERE datname='glitchtip'\" | grep -q 1 ||
             psql -c \"CREATE DATABASE glitchtip OWNER \\\"${POSTGRES_USER:-xf_linker_user}\\\";\""
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip-migrate:
    # Runs Django migrations on the glitchtip DB. Ships with the GlitchTip
    # image as `./bin/run-migrate.sh`. One-shot, idempotent: re-running it
    # over an up-to-date DB is a no-op. Without this step a freshly created
    # DB has zero tables and the dashboard returns 500 on every endpoint
    # because every social-auth and project query hits a missing relation.
    image: glitchtip/glitchtip:latest
    container_name: xf_linker_glitchtip_migrate
    restart: "no"
    command: ./bin/run-migrate.sh
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-xf_linker_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/glitchtip"
      REDIS_URL: redis://redis:6379/4
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-change-me-in-production-glitchtip}"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:1337
      DEFAULT_FROM_EMAIL: glitchtip@localhost
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: xf_linker_glitchtip
    restart: always
    mem_limit: 256m
    # NOTE: do NOT add `env_file: .env` here. The project .env sets
    # DJANGO_SETTINGS_MODULE for the backend, which would collide with
    # GlitchTip's own Django settings and crash it with
    # `ModuleNotFoundError: No module named 'config'`.
    # GlitchTip runs against its own `/glitchtip` DB, isolated from the
    # linker's `${POSTGRES_DB}`, so its migrations never touch our tables.
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-xf_linker_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/glitchtip"
      REDIS_URL: redis://redis:6379/4
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-change-me-in-production-glitchtip}"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:1337
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      ENABLE_USER_REGISTRATION: "true"
      PORT: "8000"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    ports:
      - "127.0.0.1:1337:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    # Processes error events. Default-on (see CLAUDE.md rule).
    image: glitchtip/glitchtip:latest
    container_name: xf_linker_glitchtip_worker
    restart: always
    mem_limit: 256m
    command: ./bin/run-celery-with-beat.sh
    # Same env_file caveat as glitchtip above — keep this isolated from
    # the linker .env. Uses the same `/glitchtip` DB.
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-xf_linker_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/glitchtip"
      REDIS_URL: redis://redis:6379/4
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-change-me-in-production-glitchtip}"
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:1337
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────
  # Pyroscope — continuous profiling (flamegraphs of hot Python code).
  # Default-on alongside GlitchTip. Localhost-bound on host port 4040; no
  # auth (same security posture as GlitchTip's 1337 — host-only access).
  # The backend + Celery workers ship profiles via the `pyroscope-io`
  # Python agent (see backend/config/wsgi.py and the Celery startup).
  # See docs/OBSERVABILITY-OPTIONS.md and docs/CPP-DAILY-ISSUE-PICKER-SPEC.md
  # for how Pyroscope hot-functions feed the auto_issues registry.
  # ─────────────────────────────────────────────
  pyroscope:
    # ISS-103 RESOLVED 2026-05-09: the legacy `pyroscope-io==0.8.7`
    # `/ingest` push-protocol was incompatible with this 1.x server (200
    # OK accepted but no profiles indexed). Fixed by upgrading the agent
    # to `pyroscope-io==1.0.6` which sends pprof-format profiles. Verified
    # via `curl POST http://localhost:4040/querier.v1.QuerierService/LabelValues -d '{"name":"service_name"}'`
    # which now returns `["pyroscope", "xf-linker-backend",
    # "xf-linker-celery-beat", "xf-linker-celery-default",
    # "xf-linker-celery-pipeline"]`. Both detectors are wired:
    # week-over-week regressions (needs 7-day history, ready 2026-05-16)
    # and same-day hotspots (added 2026-05-10, works from day one — see
    # `apps.auto_issues.services.pyroscope_picker.pick_pyroscope_hotspots`).
    image: grafana/pyroscope:1.18.1
    container_name: xf_linker_pyroscope
    restart: always
    mem_limit: 512m
    volumes:
      - pyroscope_data:/data
    ports:
      - "127.0.0.1:4040:4040"
    command:
      - "-config.file=/etc/pyroscope.yaml"
      - "-target=all"
    configs:
      - source: pyroscope_config
        target: /etc/pyroscope.yaml

  # ─────────────────────────────────────────────
  # postgres-exporter — exposes Postgres internals (connections, slow
  # queries, locks, replication) as Prometheus metrics on :9187. The
  # OTel Collector scrapes this endpoint via its `prometheus` receiver
  # and re-exports under the same Prometheus pipeline as the SDK metrics
  # — so /metrics on :8889 includes both app + DB metrics.
  # ─────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: xf_linker_postgres_exporter
    restart: always
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-xf_linker_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-xf_linker}?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Localhost-bound on the host side (not strictly needed since we
    # scrape via the docker network, but exposes :9187 for ad-hoc checks).
    ports:
      - "127.0.0.1:9187:9187"

  # ─────────────────────────────────────────────
  # OpenTelemetry Collector — vendor-neutral traces, metrics, logs, and profiles hub.
  # Receives OTLP (HTTP, port 4318) from the Python OTel SDK in the
  # backend + Celery workers. Fans out:
  #  - Traces → GlitchTip's OTLP endpoint (so they show up in the same
  #    Performance UI as the Sentry-SDK transactions).
  #  - Metrics → Prometheus scrape endpoint at 8889 (host-bound).
  #  - Logs   → stdout (visible via `docker compose logs otel-collector`).
  #  - Profiles → Pyroscope on port 4040 through OTLP gRPC.
  # Default-on alongside GlitchTip + Pyroscope. Localhost-only.
  # ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: xf_linker_otel_collector
    restart: always
    mem_limit: 256m
    command:
      - "--config=/etc/otelcol/config.yaml"
      - "--feature-gates=service.profilesSupport"
    configs:
      - source: otelcol_config
        target: /etc/otelcol/config.yaml
    volumes:
      # Read-only mount of the nginx access log volume so the
      # `filelog/nginx` receiver can tail it.
      - nginx_logs:/var/log/nginx-shared:ro
    ports:
      # OTLP HTTP (4318) and gRPC (4317) for SDK ingest. Localhost-bound.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # Prometheus scrape endpoint. Localhost-bound.
      - "127.0.0.1:8889:8889"
    depends_on:
      glitchtip:
        condition: service_started
      postgres-exporter:
        condition: service_started

  # ─────────────────────────────────────────────
  # Loki — log aggregation database. Stores all container stdout logs
  # (shipped by Grafana Alloy below) for 30 days, queryable via LogQL.
  # Default-on alongside GlitchTip + Pyroscope + otel-collector.
  # Localhost-only on :3100. Single-binary filesystem-backed mode (the
  # operator's laptop is not a multi-node cluster) — TSDB schema, no
  # object storage, in-memory ring.
  #
  # Why Loki on top of GlitchTip + OTel: GlitchTip captures errors;
  # otel-collector captures traces; Loki captures EVERY stdout line so
  # we can grep across services (`{container_name=~".+"} |~ "WARN"`).
  # The `loki_picker` (apps.auto_issues.services.loki_picker, Stream 4)
  # turns repeated WARN/ERROR patterns into AutoIssues with
  # source='loki'. See plan does-adding-qodana-make-swift-wall.md.
  # ─────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: xf_linker_loki
    restart: always
    mem_limit: 512m
    user: "0:0"  # Loki writes to /loki; root inside container is fine because the volume is named (no host bind).
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    configs:
      - source: loki_config
        target: /etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  # ─────────────────────────────────────────────
  # Grafana Alloy — log shipper. Discovers running Docker containers via
  # the Docker socket and tails each container's stdout, forwarding to
  # Loki. Replaces Promtail (EOL March 2026); single-purpose here (logs
  # only) because Alloy's stock build does NOT include the contrib
  # `sentry` exporter that otel-collector uses to push traces to
  # GlitchTip — so otel-collector stays in place for traces + metrics +
  # nginx logs, and Alloy is purely additive for container logs.
  # See plan does-adding-qodana-make-swift-wall.md Stream 3.
  # ─────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: xf_linker_alloy
    restart: always
    mem_limit: 192m
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    volumes:
      # Read-only Docker socket — Alloy uses it to discover containers
      # and tail their log streams. NOT used to start/stop containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      # Alloy's own UI/debug endpoint. Localhost-only; exposes pipeline
      # graph + component status at http://localhost:12345.
      - "127.0.0.1:12345:12345"
      # Faro receiver — the browser ships Faro Web SDK events to this
      # port. Localhost-only because everything else in the stack is
      # localhost-bound; for a multi-host deploy, change the bind.
      - "127.0.0.1:12347:12347"
    depends_on:
      loki:
        condition: service_started

  # ─────────────────────────────────────────────
  # Tempo — distributed trace backend (added 2026-05-11 per plan
  # ~/.claude/plans/objective-deploy-and-integrate-zany-bee.md Stream 1).
  # Monolithic single-binary mode; local filesystem storage on the
  # tempo_data named volume. Retention defaults to 72 h on laptop
  # tier and 168 h on workstation tier; pass TEMPO_RETENTION_HOURS in
  # .env to override.
  #
  # otel-collector now fans traces out to BOTH the Sentry exporter
  # (→ GlitchTip, ABSOLUTE-protected) AND a new otlp/tempo exporter
  # (→ this service). The same trace exists in both stores so a
  # GlitchTip error event and its full Tempo trace can be cross-linked
  # via the shared traceID. See `otelcol-config.yaml` for the pipeline.
  # ─────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.6.1
    container_name: xf_linker_tempo
    restart: always
    mem_limit: 768m
    command:
      - "-config.expand-env=true"
      - "-config.file=/etc/tempo/config.yaml"
    environment:
      # 72h on low/medium tier; bump to 168h on workstation tier.
      # The migration's `tempo.retention_hours` AppSetting is the
      # operator-facing record of choice; this env var is what the
      # Tempo container actually reads at boot.
      TEMPO_RETENTION_HOURS: ${TEMPO_RETENTION_HOURS:-72}
    configs:
      - source: tempo_config
        target: /etc/tempo/config.yaml
    volumes:
      - tempo_data:/var/tempo
    ports:
      # Tempo HTTP API (search + ready). Localhost-bound; the otel-
      # collector talks to it via the docker network on internal
      # gRPC :4317 (not exposed to host).
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Grafana — visualisation UI for Tempo, Loki, Pyroscope, and the
  # Prometheus metrics exported by otel-collector. Added 2026-05-11
  # per plan Stream 2. Localhost-only on port 3000. Admin password
  # required via GRAFANA_ADMIN_PASSWORD in .env. Anonymous access OFF.
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: xf_linker_grafana
    restart: always
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Follows the same `:-default` pattern as GLITCHTIP_SECRET_KEY so a
      # fresh checkout boots without manual .env edits. The default is
      # NOT secret-strong on purpose — the user is expected to set
      # GRAFANA_ADMIN_PASSWORD in .env before exposing Grafana beyond
      # localhost. Grafana itself prompts for a password change on
      # first login if the value is the default `admin`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_use_a_strong_password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      pyroscope:
        condition: service_started

volumes:
  pgdata:
    driver: local
  pyroscope_data:
    driver: local
  redis-data:
    driver: local
  media_files:
    driver: local
  frontend_dist:
    driver: local
  compiled_artifacts:
    driver: local
  compiled_tool_cache:
    driver: local
  frontend_tool_cache:
    driver: local
  go_tool_mod_cache:
    driver: local
  staticfiles:
    driver: local
  # Slice 1.5 — Unix-domain socket transport between backend (Python) and the
  # streamd Go sidecar. Protected by docs/PROTECTED-DATA-STORES.md — the socket
  # file is ephemeral, but the volume holding it must survive `docker compose
  # down` so callers keep the same path after a stop/start.
  streamd_sock:
    driver: local
  hf_cache:
    driver: local
  nginx_logs:
    driver: local
  loki_data:
    driver: local
  alloy_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
  questdb_data:
    driver: local
  sqlite_registry_data:
    driver: local

configs:
  pyroscope_config:
    file: ./pyroscope.yaml
  otelcol_config:
    file: ./otelcol-config.yaml
  loki_config:
    file: ./loki-config.yaml
  alloy_config:
    file: ./config.alloy
  tempo_config:
    file: ./tempo/tempo-config.yaml
